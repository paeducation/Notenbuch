<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Notenbuch</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<meta name="theme-color" content="#1D1D1F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notenbuch">
<style>
  :root{
    --bg:#F0F0F3; --surface:#FFFFFF; --surface-soft:#F6F6F8;
    --ink:#1D1D1F; --ink-soft:#7A7A80; --line:#E3E3E7;
    --accent:#2F7DE1; --accent-soft:#E8F1FE;
    --pass:#1F9254; --pass-soft:#E4F6EC;
    --warn:#B7791F; --warn-soft:#FBF0DA;
    --danger:#E5484D; --danger-soft:#FBE7E8;
    --radius:12px;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;}
  button, input:not([type=checkbox]):not([type=radio]):not([type=color]), select, textarea{-webkit-appearance:none;appearance:none;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;}
  body{padding-bottom:50px;}
  h1,h2,h3{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:700;margin:0;letter-spacing:-0.01em;}
  .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;}

  .titlebar{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:9px 14px;background:linear-gradient(#FBFBFC,#F1F1F3);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:31;
  }
  .titlebar .dots{position:absolute;left:16px;display:flex;gap:6px;}
  .titlebar .dot{width:11px;height:11px;border-radius:50%;}
  .titlebar h1{font-size:0.95rem;color:var(--ink-soft);font-weight:600;}
  .schoolyear-wrap{display:inline-flex;align-items:center;gap:6px;margin-left:6px;}
  .schoolyear-label{font-size:0.78rem;color:var(--ink-soft);font-weight:600;background:#E5E5E7;padding:2px 7px;border-radius:6px;}
  .schoolyear-input{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 6px;width:96px;font-size:0.85rem;font-weight:700;color:var(--ink);}
  .schoolyear-input:focus{outline:none;}
  .icon-add-btn{width:36px;height:36px;min-width:36px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:1.5rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0;
    line-height:1;border:none;box-shadow:var(--shadow);}
  .icon-add-btn.labeled{width:auto;min-width:auto;height:auto;border-radius:20px;padding:9px 16px;gap:8px;
    font-size:0.86rem;font-weight:700;}
  .icon-add-btn.labeled span{font-size:0.86rem;}
  .grp-head .colx{width:20px;height:20px;min-width:20px;border-radius:7px;background:rgba(255,255,255,0.95);
    color:#1D1D1F;font-size:0.85rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0;}
  .grp-head .colx.danger{color:var(--danger);}

  header.app{
    padding:12px 16px;border-bottom:1px solid var(--line);
    background:var(--surface);position:sticky;top:38px;z-index:30;
  }
  .class-row{display:flex;gap:8px;align-items:center;}
  select, input[type=text], input[type=number], input[type=date], input[type=password], textarea{
    font-family:inherit;font-size:0.92rem;padding:8px 12px;border:1px solid var(--line);
    border-radius:9px;background:var(--surface-soft);color:var(--ink);
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  button{font-family:inherit;font-size:0.86rem;font-weight:600;padding:8px 14px;
    border-radius:20px;border:1px solid var(--accent);background:var(--accent);color:#fff;
    cursor:pointer;white-space:nowrap;transition:opacity .1s;}
  button.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:600;box-shadow:var(--shadow);}
  button.small{padding:6px 12px;font-size:0.78rem;}
  button:active{opacity:0.7;}
  button:disabled{opacity:0.35;cursor:default;}
  .icon-btn{width:34px;height:34px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:0.95rem;}

  .sem-row{display:inline-flex;gap:2px;margin-top:10px;background:var(--surface-soft);
    border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap;}
  .sem-tab{padding:6px 14px;border-radius:8px;border:none;background:transparent;color:var(--ink-soft);
    font-weight:600;font-size:0.82rem;cursor:pointer;}
  .sem-tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}

  .toolbar{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:10px 16px;
    background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:192px;z-index:29;}
  .weight-warn{font-size:0.76rem;color:var(--warn);background:var(--warn-soft);padding:4px 10px;
    border-radius:20px;margin-left:auto;white-space:nowrap;font-weight:600;}
  main{padding:16px;}
  .empty{text-align:center;color:var(--ink-soft);padding:48px 16px;font-size:0.95rem;line-height:1.5;}
  button.active-toggle{background:var(--accent);color:#fff;border-color:var(--accent);}
  .compare-wrap{display:flex;flex-direction:column;gap:24px;}
  .compare-col{width:100%;}
  .compare-col h3{margin-bottom:8px;font-size:0.95rem;color:var(--ink-soft);}
  .grid-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--surface);max-width:100%;box-shadow:var(--shadow);}
  table.grid{border-collapse:separate;border-spacing:0;font-size:0.84rem;min-width:100%;}
  table.grid th, table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);
    padding:6px 8px;text-align:center;white-space:nowrap;}
  table.grid th:last-child, table.grid td:last-child{border-right:none;}
  table.grid thead th{background:var(--surface);font-weight:600;color:var(--ink);font-size:0.76rem;}
  .grp-head{color:#fff;font-weight:700;font-size:0.68rem;
    padding:4px 8px;text-transform:uppercase;letter-spacing:0.03em;}
  .grp-head-wrap{position:relative;display:block;}
  .grp-head .grp-inner{display:flex;align-items:center;justify-content:center;gap:6px;}
  .cat-head{background:var(--surface);min-width:58px;padding-left:5px!important;padding-right:5px!important;}
  .collapsed-col{width:56px!important;max-width:56px!important;min-width:56px!important;}
  .colhead-wrap{position:relative;display:block;}
  .colhead-wrap .colhead{position:relative;z-index:1;}
  .cat-head.total-head{background:var(--surface-soft);font-weight:700;}
  .cat-head .colhead{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:2px 0;}
  .cat-head .weight{font-weight:500;color:var(--ink-soft);font-size:0.66rem;}
  .cat-mode{font-size:0.6rem;color:var(--ink-soft);}
  th.name-col, td.name-col{background:var(--surface);text-align:left;font-weight:600;min-width:120px;}
  th.endnote-col, td.endnote-col{background:var(--accent-soft);
    border-left:2px solid var(--accent);border-right:2px solid var(--accent);
    text-align:center;vertical-align:middle;}
  .endnote-head{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;text-align:center;}
  td.name-col{z-index:6;font-weight:500;}
  td.endnote-col{z-index:6;}
  td.total-col{background:var(--surface-soft);border-right:2px solid var(--ink-soft);}
  .colx{border:none;background:rgba(255,255,255,0.3);color:#fff;font-size:0.7rem;width:18px;height:18px;
    border-radius:50%;cursor:pointer;font-weight:700;line-height:1;}
  .colx.dark{background:transparent;color:var(--ink-soft);width:auto;height:auto;border-radius:4px;padding:0 4px;}
  .colx.dark:hover{color:var(--danger);}
  .cell-stack{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:3px 2px;border-radius:8px;position:relative;}
  .cell-stack:hover{background:var(--surface-soft);}
  .reset-arrow{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:0.72rem;font-weight:800;border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;padding:0;
    box-shadow:0 1px 2px rgba(0,0,0,.25);z-index:2;}
  .note-pill{display:inline-block;min-width:26px;text-align:center;padding:2px 7px;border-radius:14px;
    font-weight:700;font-size:0.8rem;font-family:ui-monospace,'SF Mono',Menlo,monospace;}
  .note-1,.note-2{background:var(--pass-soft);color:var(--pass);}
  .note-3,.note-4{background:var(--warn-soft);color:var(--warn);}
  .note-5,.note-6{background:var(--danger-soft);color:var(--danger);}
  .note-dash{color:var(--ink-soft);font-family:ui-monospace,'SF Mono',Menlo,monospace;}
  .border-badge{display:inline-block;margin-left:3px;font-size:0.62rem;font-weight:700;padding:1px 4px;border-radius:8px;vertical-align:middle;}
  .border-badge.border-ok{background:var(--pass-soft);color:var(--pass);}
  .border-badge.border-warn{background:var(--danger-soft);color:var(--danger);cursor:pointer;}
  .border-badge.border-resolved{background:var(--warn-soft);color:var(--warn);}
  input.brightness-range{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:8px;
    background:linear-gradient(to right, #000, #fff);border:1px solid var(--line);}
  input.brightness-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;
    border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer;}
  input.brightness-range::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--accent);
    border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer;}
  .note-pill.border-tie-pill{background:var(--danger-soft);color:var(--danger);cursor:pointer;font-size:0.78rem;padding:2px 8px;}
  .avg-sub{font-size:0.64rem;color:var(--ink-soft);font-family:ui-monospace,'SF Mono',Menlo,monospace;}
  .mini-toggle{position:relative;display:inline-block;width:28px;height:16px;flex-shrink:0;}
  .mini-toggle input{opacity:0;width:0;height:0;}
  .mini-toggle .mini-slider{position:absolute;inset:0;background:var(--ink-soft);border-radius:16px;cursor:pointer;transition:.15s;}
  .mini-toggle .mini-slider:before{content:'';position:absolute;width:12px;height:12px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s;}
  .mini-toggle input:checked + .mini-slider{background:var(--accent);}
  .mini-toggle input:checked + .mini-slider:before{transform:translateX(12px);}
  body.colorize-active .toolbar > button,
  body.colorize-active table.grid button,
  body.colorize-active table.grid input,
  body.colorize-active [data-open-entries],
  body.colorize-active [data-open-group],
  body.colorize-active [data-open-endnote],
  body.colorize-active [data-select-student]
  { pointer-events:none!important; opacity:0.4; }
  body.colorize-active #colorizeSammelBtn,
  body.colorize-active .mini-toggle,
  body.colorize-active .mini-toggle *
  { pointer-events:auto!important; opacity:1!important; }
  .add-student-row td{background:var(--surface-soft);}
  .add-student-row input{width:100%;min-width:130px;}
  .name-cell-row{display:flex;align-items:center;gap:6px;justify-content:space-between;}
  tr.student-selected td:not(.total-col):not(.endnote-col):not(.has-custom-color){background:var(--accent-soft)!important;}
  .panel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);}
  .form-title{font-size:0.76rem;color:var(--ink-soft);font-weight:700;margin-bottom:10px;
    text-transform:uppercase;letter-spacing:0.04em;}
  .row{display:flex;gap:8px;align-items:center;}
  .row + .row{margin-top:8px;}
  .grow{flex:1;min-width:0;}
  .hint{font-size:0.8rem;color:var(--ink-soft);line-height:1.5;margin-top:8px;}
  table.scale{width:100%;border-collapse:collapse;font-size:0.9rem;}
  table.scale td{padding:6px 4px;border-bottom:1px solid var(--line);}
  table.scale input[type=number]{padding:6px 6px;font-size:0.88rem;}
  .status{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:0.74rem;color:var(--ink-soft);
    padding:7px;background:var(--surface);border-top:1px solid var(--line);}
  .overlay{position:fixed;inset:0;background:rgba(20,20,22,0.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
  @media(min-width:480px){.overlay{align-items:center;}}
  .modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:420px;max-height:80vh;
    overflow-y:auto;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25);}
  @media(min-width:480px){.modal{border-radius:16px;}}
  .modal h3{font-size:1.05rem;margin-bottom:4px;}
  .modal .sub{color:var(--ink-soft);font-size:0.82rem;margin-bottom:12px;white-space:pre-line;}
  .entry-row{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);}
  .entry-row:last-child{border-bottom:none;}
  .grade-picker{display:flex;flex-wrap:wrap;gap:5px;flex:1;}
  .grade-chip{padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface-soft);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:0.8rem;font-weight:700;color:var(--ink);cursor:pointer;}
  .grade-chip.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
  .dlg-choices{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .dlg-choice-btn{width:100%;text-align:left;background:var(--surface-soft);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:0.92rem;font-weight:600;}
  .dlg-choice-btn:active{background:var(--accent-soft);border-color:var(--accent);}
  .switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;inset:0;background:var(--line);transition:.2s;border-radius:24px;cursor:pointer;}
  .switch .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;
    background:#fff;transition:.2s;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .switch input:checked + .slider{background:var(--accent);}
  .switch input:checked + .slider:before{transform:translateX(18px);}
  .switch.sm{width:34px;height:20px;}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:2px;}
  .status-dot.on{background:var(--pass);}
  .switch.sm .slider:before{height:14px;width:14px;}
  .switch.sm input:checked + .slider:before{transform:translateX(14px);}
  .modal-close{position:sticky;top:0;text-align:right;}
  @page{size:A4 portrait;margin:10mm;}
  .print-header{display:none;}
  @media print{
    .titlebar, header.app, .toolbar, #scalePanel, #modalRoot, .status{display:none!important;}
    body{padding-bottom:0!important;background:#fff!important;}
    main{padding:0!important;}
    .print-header{display:flex!important;gap:18px;flex-wrap:wrap;font-size:11px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #999;}
    table.grid th, table.grid td{white-space:normal!important;word-break:break-word;}
    .grid-wrap{max-height:none!important;overflow:visible!important;box-shadow:none!important;border:none!important;}
    table.grid{font-size:10px!important;}
    .colx, .reset-arrow, [data-del-student], .add-student-row{display:none!important;}
    .compare-wrap{gap:12px!important;}
  }
</style>
</head>
<body>

<div class="titlebar">
  <div class="dots"><span class="dot" style="background:#FF5F57;"></span><span class="dot" style="background:#FEBC2E;"></span><span class="dot" style="background:#28C840;"></span></div>
  <h1>Notenbuch</h1>
  <span class="schoolyear-wrap"><span class="schoolyear-label">Schuljahr</span><input type="text" id="schoolYearInput" class="schoolyear-input" maxlength="9"></span>
</div>

<header class="app">
  <div class="sem-row" id="classRow"></div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <div class="sem-row" id="semRow" style="margin:0;"></div>
  </div>
</header>

<div class="toolbar">
  <button class="ghost small" id="positionModeBtn">↕ Position</button>
  <button class="ghost small" id="copyStructureBtn">⇄ Struktur aus 1. HJ übernehmen</button>
  <button class="ghost small" id="toggleScaleBtn">Notenschema</button>
  <span style="display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:0.78rem;font-weight:600;padding:6px 8px 6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);white-space:nowrap;">
    <span id="colorizeSammelBtn" style="cursor:default;opacity:0.5;">🎨 Färben</span>
    <label class="mini-toggle" title="Ein-/Ausschalten (Aus = Farben fixieren)">
      <input type="checkbox" id="colorizeToggle">
      <span class="mini-slider"></span>
    </label>
  </span>
  <button class="ghost small" id="quickBackupBtn" title="Backup jetzt herunterladen">💾</button>
  <span style="display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:0.78rem;font-weight:600;padding:6px 8px 6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);white-space:nowrap;">
    <span id="undoBtn" style="cursor:default;opacity:0.5;">↩️ Rückgängig</span>
    <label class="mini-toggle" title="Ein-/Ausschalten (Sicherung gegen versehentliches Tippen)">
      <input type="checkbox" id="undoToggle">
      <span class="mini-slider"></span>
    </label>
  </span>
  <button class="ghost small" id="borderlineToggleBtn">🎯 Grenzfälle</button>
  <button class="ghost small" id="dataManagementBtn">🗂 Datenverwaltung</button>
  <input type="file" id="csvImportFile" accept=".csv,text/csv" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">
  <button class="ghost small" id="printBtn">🖨 Drucken</button>
  <button class="ghost small icon-btn" id="helpBtn" title="Begriffe erklärt">?</button>
  <input type="file" id="importFile" accept=".json,application/json" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">
</div>

<main id="main"></main>
<div id="scalePanel"></div>
<div id="modalRoot"></div>
<div class="status" id="status">Wird geladen …</div>

<script>
const STORAGE_KEY = 'classes';
let state = { classes: [], activeClassId: null, scaleOpen: false, searchTerm: '', compareView: false, positionMode: false, selectedStudentId: null, incognito: false, colorizeMode: false, colorizeSelection: [] };
let pendingCsvStufe = 'SII';
let searchWasFocused = false;

const NOTEN_TABLE = [
  {min:95, note:'1+'}, {min:90, note:'1'}, {min:85, note:'1-'},
  {min:80, note:'2+'}, {min:75, note:'2'}, {min:70, note:'2-'},
  {min:65, note:'3+'}, {min:60, note:'3'}, {min:55, note:'3-'},
  {min:50, note:'4+'}, {min:45, note:'4'}, {min:40, note:'4-'},
  {min:33, note:'5+'}, {min:27, note:'5'}, {min:20, note:'5-'},
  {min:0, note:'6'},
];
const PUNKTE_TABLE = [
  {min:95, note:15}, {min:90, note:14}, {min:85, note:13}, {min:80, note:12},
  {min:75, note:11}, {min:70, note:10}, {min:65, note:9}, {min:60, note:8},
  {min:55, note:7}, {min:50, note:6}, {min:45, note:5}, {min:40, note:4},
  {min:33, note:3}, {min:27, note:2}, {min:20, note:1}, {min:0, note:0},
];
const GROUP_COLORS = ['#5B87B8','#B0699A','#8B7BB0','#B18257','#5F9478','#B5716E','#A08A57'];
function colorForGroupName(name){
  const str = (name||'').trim().toLowerCase();
  let hash = 0;
  for(let i=0; i<str.length; i++){ hash = (hash * 31 + str.charCodeAt(i)) | 0; }
  return GROUP_COLORS[Math.abs(hash) % GROUP_COLORS.length];
}

function uid(){ return Math.random().toString(36).slice(2,10); }
const APP_VERSION_INFO = 'v15.7 · Entwickler: G. Schulte';
function setStatus(msg, isError){
  const el = document.getElementById('status');
  el.textContent = msg + ' · ' + APP_VERSION_INFO; el.style.color = isError ? 'var(--pen)' : 'var(--ink-soft)';
}

// ---------- grade/value helpers ----------
function tendencyOffset(t){ return t==='+' ? -0.3 : t==='-' ? 0.3 : 0; }
function gradeStrToValue(str){
  const m = String(str).match(/^([1-6])([+-]?)$/);
  if(!m) return null;
  return parseInt(m[1]) + tendencyOffset(m[2]);
}
function valueToGradeStr(value){

function rebalanceEqualWeights(list){
  const graded = list.filter(item => !item.ungraded);
  const manual = graded.filter(item => item.manualWeight);
  const auto = graded.filter(item => !item.manualWeight);
  if(auto.length === 0) return;
  const manualSum = manual.reduce((s,item) => s + (item.weight||0), 0);
  const remaining = Math.max(0, 100 - manualSum);
  const n = auto.length;
  const base = Math.floor(remaining/n);
  auto.forEach((item,i) => { item.weight = (i === n-1) ? (remaining - base*(n-1)) : base; });
}

}

// ---------- Backup-Verschlüsselung (Web Crypto, Passwort wird bei jedem Backup neu abgefragt) ----------
function bufToBase64(buf){
  let binary = '';
  const bytes = new Uint8Array(buf);
  for(let i=0; i<bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}
function base64ToBuf(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}
async function deriveKeyFromPassword(password, saltBytes){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBytes, iterations: 150000, hash:'SHA-256'},
    baseKey, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function encryptBackupJson(plainJsonStr, password){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKeyFromPassword(password, salt);
  const ciphertext = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(plainJsonStr));
  return JSON.stringify({encrypted: true, salt: bufToBase64(salt), iv: bufToBase64(iv), data: bufToBase64(ciphertext)});
}
async function decryptBackupJson(encryptedObj, password){
  const salt = new Uint8Array(base64ToBuf(encryptedObj.salt));
  const iv = new Uint8Array(base64ToBuf(encryptedObj.iv));
  const key = await deriveKeyFromPassword(password, salt);
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, base64ToBuf(encryptedObj.data));
  return new TextDecoder().decode(plainBuf);
}
function exportBackup(){

async function downloadBlobAsFile(str, filename){
  const blob = new Blob([str], {type: 'application/json'});
  try{
    const plainFile = new File([blob], filename, {type: 'text/plain'});
    if(navigator.canShare && navigator.canShare({files: [plainFile]})){
      await navigator.share({files: [plainFile], title: filename});
      return; // shared successfully (e.g. saved to IServ/Drive/etc.)
    }
    const jsonFile = new File([blob], filename, {type: 'application/json'});
    if(navigator.canShare && navigator.canShare({files: [jsonFile]})){
      await navigator.share({files: [jsonFile], title: filename});
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return; // user deliberately cancelled the share sheet
    // any other share failure: fall through to the plain download below
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseCSV(text){
  const lines = text.split(/\r\n|\n|\r/).filter(l => l.trim() !== '');
  if(!lines.length) return {header: [], rows: []};
  const delim = (lines[0].match(/;/g)||[]).length >= (lines[0].match(/,/g)||[]).length ? ';' : ',';
  function splitLine(line){
    const result = [];
    let cur = '', inQuotes = false;
    for(let i=0; i<line.length; i++){
      const ch = line[i];
      if(ch === '"'){
        if(inQuotes && line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if(ch === delim && !inQuotes){
        result.push(cur); cur = '';
      } else cur += ch;
    }
    result.push(cur);
    return result.map(s => s.trim());
  }
  const header = splitLine(lines[0]).map(h => h.toLowerCase());
  const rows = lines.slice(1).map(splitLine);
  return {header, rows};
}
async function importCSV(file){
  const text = await file.text();
  const {rows} = parseCSV(text);
  const klasseName = (file.name || 'Import').replace(/\.csv$/i, '').trim() || 'Import';
  if(!rows.length){
    await showAlert('CSV leer', 'Es wurden keine Datenzeilen gefunden (die erste Zeile wird als Überschrift ignoriert).');
    return;
  }

  let targetCls = state.classes.find(c => c.name.trim().toLowerCase() === klasseName.toLowerCase());
  const isNewClass = !targetCls;

  const ok = await showConfirm('CSV importieren?',
    `${rows.length} Schüler werden in die Lerngruppe "${klasseName}" importiert` +
    (isNewClass ? ' (wird neu angelegt).' : ' (bereits vorhanden – Schüler werden ergänzt).'),
    {confirmLabel:'Importieren'});
  if(!ok) return;

  if(isNewClass){
    const sem1 = {id: uid(), name: '1. HJ', groups: defaultGroups(pendingCsvStufe), studentIds: [], endnoteColor: '#F2F2F2'};
    const sem2 = {id: uid(), name: '2. HJ', groups: defaultGroups(pendingCsvStufe), studentIds: [], endnoteColor: '#F2F2F2'};
    targetCls = {id: uid(), name: klasseName, students: [], semesters: [sem1, sem2], activeSemesterId: sem1.id,
      gradingSystem: 'noten', gradeTableNoten: NOTEN_TABLE.map(r=>({...r})), gradeTablePunkte: PUNKTE_TABLE.map(r=>({...r}))};
    state.classes.push(targetCls);
  }

  let addedCount = 0, skipped = 0;
  rows.forEach(row => {
    const nachname = (row[0] || '').trim();
    const vorname = (row[1] || '').trim();
    if(!nachname && !vorname) return;
    const fullName = vorname ? `${nachname}, ${vorname}` : nachname;
    const exists = targetCls.students.some(s => s.name.trim().toLowerCase() === fullName.toLowerCase());
    if(exists){ skipped++; return; }
    const student = {id: uid(), name: fullName};
    targetCls.students.push(student);
    targetCls.semesters.forEach(sm => { if(!sm.studentIds) sm.studentIds = []; sm.studentIds.push(student.id); });
    addedCount++;
  });

  state.activeClassId = targetCls.id;
  saveState(); render();
  await showAlert('CSV importiert',
    `${addedCount} Schüler zu "${klasseName}" hinzugefügt` +
    (skipped ? `, ${skipped} bereits vorhanden übersprungen` : '') + '.'
  );
}

function showDialog(opts){

      else if(type === 'confirm') finish(true);

      root.querySelectorAll('[data-choice-idx]').forEach(btn => {

      });
    }
  });
}

function hsvToRgb(h, s, v){
  const c = v * s, x = c * (1 - Math.abs((h/60) % 2 - 1)), m = v - c;
  let r,g,b;
  if(h<60){ r=c;g=x;b=0; } else if(h<120){ r=x;g=c;b=0; } else if(h<180){ r=0;g=c;b=x; }
  else if(h<240){ r=0;g=x;b=c; } else if(h<300){ r=x;g=0;b=c; } else { r=c;g=0;b=x; }
  return {r: Math.round((r+m)*255), g: Math.round((g+m)*255), b: Math.round((b+m)*255)};
}
function rgbToHsv(r, g, b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d!==0){
    if(max===r) h = 60*(((g-b)/d)%6);
    else if(max===g) h = 60*((b-r)/d+2);
    else h = 60*((r-g)/d+4);
  }
  if(h<0) h+=360;
  return {h, s: max===0?0:d/max, v: max};
}
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase(); }
function lightenColor(hex, amount){
  const rgb = hexToRgb(hex);
  const clampedAmount = Math.max(0, Math.min(1, amount));
  const r = Math.round(rgb.r + (255-rgb.r)*clampedAmount);
  const g = Math.round(rgb.g + (255-rgb.g)*clampedAmount);
  const b = Math.round(rgb.b + (255-rgb.b)*clampedAmount);
  return rgbToHex(r,g,b);
}
function hexToRgb(hex){
  const m = /^#([0-9A-Fa-f]{2})([0-9A-Fa-f]{2})([0-9A-Fa-f]{2})$/.exec(hex);
  if(!m) return {r:0,g:0,b:0};
  return {r:parseInt(m[1],16), g:parseInt(m[2],16), b:parseInt(m[3],16)};
}

    let hsv = rgbToHsv(startRgb.r, startRgb.g, startRgb.b);
    const SIZE = 220, R = SIZE/2;
    root.innerHTML = `
      <div class="overlay" id="colorOverlay">

                }).join('')}
              </div>
            </div>
          </div>
          <div class="row" style="margin-top:16px;justify-content:flex-end;gap:8px;">

    const finish = (val) => { root.innerHTML = ''; resolve(val); };
    const canvas = document.getElementById('colorWheelCanvas');
    const ctx = canvas.getContext('2d');
    const hexInput = document.getElementById('colorHexInput');
    const swatch = document.getElementById('colorSwatch');
    const brightnessSlider = document.getElementById('brightnessSlider');

    function drawWheel(){
      ctx.clearRect(0,0,SIZE,SIZE);
      const img = ctx.createImageData(SIZE, SIZE);
      for(let y=0; y<SIZE; y++){
        for(let x=0; x<SIZE; x++){
          const dx = x - R, dy = y - R;
          const dist = Math.sqrt(dx*dx + dy*dy);
          const idx = (y*SIZE + x) * 4;
          if(dist > R){ img.data[idx+3] = 0; continue; }
          let angle = Math.atan2(dy, dx) * 180/Math.PI;
          if(angle < 0) angle += 360;
          const sat = Math.min(dist / R, 1);
          const rgb = hsvToRgb(angle, sat, hsv.v);
          img.data[idx] = rgb.r; img.data[idx+1] = rgb.g; img.data[idx+2] = rgb.b; img.data[idx+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      // Auswahl-Punkt zeichnen – gefüllt mit der tatsächlich gewählten (ggf. abgedunkelten) Farbe
      const angleRad = hsv.h * Math.PI/180;
      const dist = hsv.s * R;
      const px = R + Math.cos(angleRad) * dist, py = R + Math.sin(angleRad) * dist;
      const trueRgb = hsvToRgb(hsv.h, hsv.s, hsv.v);
      ctx.beginPath();
      ctx.arc(px, py, 8, 0, Math.PI*2);
      ctx.fillStyle = rgbToHex(trueRgb.r, trueRgb.g, trueRgb.b);
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath();
      ctx.arc(px, py, 8, 0, Math.PI*2);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
    }
    function updateFromHsv(){
      const rgb = hsvToRgb(hsv.h, hsv.s, hsv.v);
      const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
      hexInput.value = hex;
      swatch.style.background = hex;
      drawWheel();
    }
    function pickAt(clientX, clientY){
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) * (SIZE/rect.width);
      const y = (clientY - rect.top) * (SIZE/rect.height);
      const dx = x - R, dy = y - R;
      const dist = Math.min(Math.sqrt(dx*dx + dy*dy), R);
      let angle = Math.atan2(dy, dx) * 180/Math.PI;
      if(angle < 0) angle += 360;
      hsv.h = angle; hsv.s = dist / R;
      updateFromHsv();
    }
    let dragging = false;
    canvas.addEventListener('pointerdown', (e) => { dragging = true; pickAt(e.clientX, e.clientY); canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', (e) => { if(dragging) pickAt(e.clientX, e.clientY); });
    canvas.addEventListener('pointerup', () => { dragging = false; });
    canvas.addEventListener('pointercancel', () => { dragging = false; });
    const brightnessValue = document.getElementById('brightnessValue');
    brightnessSlider.addEventListener('input', () => { hsv.v = brightnessSlider.value/100; brightnessValue.textContent = brightnessSlider.value + '%'; updateFromHsv(); });
    hexInput.addEventListener('input', () => {
      const v = hexInput.value.trim();
      if(/^#[0-9A-Fa-f]{6}$/.test(v)){
        const rgb = hexToRgb(v);
        hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
        brightnessSlider.value = Math.round(hsv.v*100);
        brightnessValue.textContent = Math.round(hsv.v*100) + '%';
        swatch.style.background = v;
        drawWheel();
      }
    });
    document.querySelectorAll('[data-gray-swatch]').forEach(btn => {
      btn.onclick = () => {
        const hex = btn.dataset.graySwatch;
        const rgb = hexToRgb(hex);
        hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);

        brightnessValue.textContent = Math.round(hsv.v*100) + '%';
        hexInput.value = hex;
        swatch.style.background = hex;
        drawWheel();
      };
    });
    updateFromHsv();
    document.getElementById('colorOverlay').addEventListener('click', (e) => { if(e.target.id==='colorOverlay') finish(null); });
    document.getElementById('colorCancel').onclick = () => finish(null);
    document.getElementById('colorOk').onclick = () => {
      const v = hexInput.value.trim();
      const rgb = hsvToRgb(hsv.h, hsv.s, hsv.v);
      finish(/^#[0-9A-Fa-f]{6}$/.test(v) ? v : rgbToHex(rgb.r, rgb.g, rgb.b));
    };
  });
}

function findCategoryContext(sem, groupId, catId){
  const g = sem.groups.find(x=>x.id===groupId);
  if(!g) return null;
  function search(list, parentCat){
    for(const c of list){
      if(c.id === catId) return {group:g, cat:c, parentCat, list};
      if(c.children && c.children.length){
        const found = search(c.children, c);
        if(found) return found;
      }
    }
    return null;
  }
  return search(g.children, null);
}
function findGroupByName(sem, name){
  return sem.groups.find(g => (g.name||'').trim().toLowerCase() === name.toLowerCase());

  const displayVal = scaleOverride ? convertValueScale(value, cls.gradingSystem, scaleOverride) : value;
  const bucket = colorBucket(effCls, displayVal);
  return {text: displayValue(effCls, displayVal), bucket};
}

function buildFullExportData(cls, sem){
  const students = getSemesterStudents(cls, sem);
  const headers = ['Schüler', 'Endnote'];
  const colDefs = [];
  sem.groups.forEach(g => {
    headers.push(`Gesamt ${g.name}`);
    colDefs.push({type:'group', group:g});
    function walk(cat, label){
      headers.push(label);
      colDefs.push({type:'cat', cat});
      if(cat.children) cat.children.forEach(ch => walk(ch, `${label} - ${ch.name}`));
    }
    g.children.forEach(cat => walk(cat, cat.name));
  });
  const rows = students.map(s => {
    const row = [s.name, excelCellForValue(cls, semesterEndnoteForStudent(cls, sem, s.id))];
    colDefs.forEach(def => {
      if(def.type === 'group') row.push(excelCellForValue(cls, groupGesamtForStudent(cls, def.group, s.id)));
      else row.push(excelCellForCategory(cls, def.cat, s.id));
    });
    return row;
  });
  return {headers, rows};
}
function excelFillForBucket(bucket){
  if(bucket <= 2) return {bg:'FFE4F6EC', font:'FF1F9254'};
  if(bucket <= 4) return {bg:'FFFBF0DA', font:'FFB7791F'};
  return {bg:'FFFBE7E8', font:'FFE5484D'};
}

async function downloadAsExcel(filename, sheetName, headers, rows, infoLines){
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(sheetName.slice(0,31));
  if(infoLines && infoLines.length){
    infoLines.forEach(line => { const r = ws.addRow([line]); r.font = {italic:true, size:10}; });
    ws.addRow([]);
  }
  const headerRow = ws.addRow(headers);
  headerRow.font = {bold: true};
  headerRow.eachCell(cell => { cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFEFEFEF'}}; });
  rows.forEach(cellsInRow => {
    const plainValues = cellsInRow.map(c => (c && typeof c === 'object') ? c.text : c);
    const row = ws.addRow(plainValues);
    cellsInRow.forEach((c, i) => {
      if(c && typeof c === 'object' && c.bucket !== undefined){
        const colors = excelFillForBucket(c.bucket);
        const cell = row.getCell(i+1);
        cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb: colors.bg}};
        cell.font = {color:{argb: colors.font}, bold:true};
        cell.alignment = {horizontal:'center'};
      }
    });
  });
  ws.columns.forEach(col => { col.width = 16; });
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function catWidth(cat){
  if(cat.collapsed) return 1;
  return (cat.children && cat.children.length) ? cat.children.reduce((s,c)=>s+catWidth(c),0) + 1 : 1;
}
function catDepth(cat){
  return (cat.children && cat.children.length) ? 1 + Math.max(...cat.children.map(catDepth)) : 1;
}
function maxCatDepth(groups){
  let d = 1;
  groups.forEach(g => g.children.forEach(c => { d = Math.max(d, catDepth(c)); }));
  return d;
}

      groupHeadRow += `<th class="grp-head collapsed-col" rowspan="${topRowspan}" style="background:${(g.bgColor || colorForGroupName(g.name))};">
        <div class="grp-inner" style="flex-direction:column;gap:6px;padding:4px 0;width:32px;max-width:32px;overflow:hidden;margin:0 auto;">
          <span data-rename-group="${g.id}" style="cursor:pointer;writing-mode:vertical-rl;font-size:0.62rem;">${escapeHtml(g.name)}</span>
          <button class="colx" data-toggle-group-collapse="${g.id}" title="Einblenden" style="display:inline-flex;align-items:center;">${eyeIconSvg(true)}</button>
        </div>
      </th>`;
      return;
    }
    const span = g.children.length === 0 ? 2 : g.children.reduce((s,c)=>s+catWidth(c), 0) + 1;
    const groupSelected = state.colorizeMode && isColorizeSelected('group', g.id);
    const groupSelectStyle = groupSelected ? 'box-shadow:inset 0 0 0 3px var(--accent);' : '';
    groupHeadRow += `<th class="grp-head" colspan="${span}" data-select-group="${g.id}" style="background:${(g.bgColor || colorForGroupName(g.name))};${groupSelectStyle}">
      <div class="grp-head-wrap">
        <div class="grp-inner">
          ${state.positionMode ? `<button class="colx" data-move-group="${g.id}" data-dir="-1">‹</button>` : ''}
          <span data-rename-group="${g.id}" style="cursor:pointer;">${escapeHtml(g.name)}${groupSelected ? ' ✓' : ''} <span style="font-weight:400;opacity:0.85;">${g.weight}%</span></span>
          <button class="colx" data-add-cat="${g.id}">+</button>
          ${g.locked ? '' : `<button class="colx danger" data-del-group="${g.id}">✕</button>`}
          ${state.positionMode ? `<button class="colx" data-move-group="${g.id}" data-dir="1">›</button>` : ''}
        </div>
      </div>
    </th>`;
  });
  groupHeadRow += `</tr>`;

  const GRADIENT_STEP = 0.4;
  const ADDITIONAL_ROW_FADE = 0.45;
  function catHeaderCell(cat, g, colspan, rowspan, depth, levelColor){
    const isSelected = state.colorizeMode && isColorizeSelected('cat', cat.id);
    const selectStyle = isSelected ? 'box-shadow:inset 0 0 0 3px var(--accent);' : '';
    const selectMark = isSelected ? ' ✓' : '';
    const bgStyle = levelColor ? `background:${levelColor};` : '';
    const nameRow = `<div class="row" style="gap:4px;align-items:center;justify-content:center;">
      <span data-edit-cat="${cat.id}" data-group="${g.id}" title="Antippen: bearbeiten, duplizieren oder löschen">${dateRangeDotHtml(cat)}${escapeHtml(cat.name)}${selectMark}</span>
    </div>`;
    if(cat.collapsed){
      const isContainer = cat.children && cat.children.length;
      const collapsedEye = isContainer ? `<button class="colx dark" data-toggle-cat-collapse="${cat.id}" data-group="${g.id}" title="Einblenden" style="display:inline-flex;align-items:center;justify-content:center;padding:0;width:16px;height:16px;">${eyeIconSvg(true)}</button>` : '';
      return `<th class="cat-head collapsed-col" style="${bgStyle}${selectStyle}" ${rowspan>1?`rowspan="${rowspan}"`:''} colspan="1">
        <div class="colhead" data-select-cat="${cat.id}" data-group="${g.id}" style="flex-direction:column;gap:6px;padding:4px 0;width:32px;max-width:32px;overflow:hidden;margin:0 auto;">
          <span data-edit-cat="${cat.id}" data-group="${g.id}" title="Antippen: bearbeiten, duplizieren oder löschen" style="writing-mode:vertical-rl;font-size:0.68rem;cursor:pointer;">${dateRangeDotHtml(cat)}${escapeHtml(cat.name)}${selectMark}</span>
          ${collapsedEye}
        </div>
      </th>`;
    }
    return `<th class="cat-head" style="${bgStyle}${selectStyle}" ${rowspan>1?`rowspan="${rowspan}"`:''} colspan="${colspan}">
      <div class="colhead" data-select-cat="${cat.id}" data-group="${g.id}">
        ${nameRow}
        <span class="weight">${cat.weight}%${cat.manualWeight ? lockIconSvg() : ''}${isContainerCat(cat) ? '' : ' · '+(cat.mode==='points'?'Punkte':'Note')}</span>
        ${(cat.date && !isContainerCat(cat)) ? `<span class="weight">${formatDate(cat.date)}</span>` : ''}
        <div class="row" style="gap:2px;">
          ${state.positionMode ? `<button class="colx dark" data-move-cat="${cat.id}" data-group="${g.id}" data-dir="-1">‹</button>` : ''}
          <button class="colx dark" data-add-near-cat="${cat.id}" data-group="${g.id}" style="font-size:1.15rem;font-weight:700;width:24px;height:24px;">+</button>
          ${state.positionMode ? `<button class="colx dark" data-move-cat="${cat.id}" data-group="${g.id}" data-dir="1">›</button>` : ''}
        </div>
      </div>
    </th>`;
  }
  // Build one row-string per depth level (0..maxDepth-1) for a category subtree, recursively.
  // baseColor is inherited from the parent (or the group) unless this category has its own
  // bgColor; each nesting level gets a progressively lighter shade of that base color.
  function buildCatRows(cat, g, depth, baseColor){
    const rowsNeeded = maxDepth - depth;
    const rows = new Array(rowsNeeded).fill('');
    const hasKids = !cat.collapsed && cat.children && cat.children.length;
    const ownColor = cat.bgColor || undefined;
    rows[0] = catHeaderCell(cat, g, catWidth(cat), hasKids ? 1 : rowsNeeded, depth, ownColor);
    if(hasKids){
      const gesamtRowspan = rowsNeeded - 1;
      const gesamtColor = ownColor ? lightenColor(ownColor, GRADIENT_STEP) : undefined;
      const eyeBtn = `<button class="colx" data-toggle-cat-collapse="${cat.id}" data-group="${g.id}" title="${cat.collapsed?'Einblenden':'Ausblenden'}" style="position:absolute;left:50%;top:8px;transform:translateX(-50%);display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;padding:0;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.15);border-radius:4px;color:var(--ink);">${eyeIconSvg(false)}</button>`;
      const gesamtCell = `<th class="cat-head total-head" ${gesamtRowspan>1?`rowspan="${gesamtRowspan}"`:''} style="position:relative;${gesamtColor?`background:${gesamtColor};`:''}">${eyeBtn}</th>`;
      const childRowSets = cat.children.map(child => buildCatRows(child, g, depth+1, undefined));
      for(let r=0; r<rowsNeeded-1; r++){
        let content = (r===0 ? gesamtCell : '');
        childRowSets.forEach(set => { content += set[r] || ''; });
        rows[r+1] = content;
      }
    }
    return rows;
  }

  const catRowStrings = new Array(maxDepth).fill('');
  groups.forEach(g => {
    if(g.collapsed) return;
    const groupColor = g.bgColor || colorForGroupName(g.name);
    const groupGesamtColor = lightenColor(groupColor, GRADIENT_STEP);
    const groupRowSets = [`<th class="cat-head total-head" style="background:${groupGesamtColor};position:relative;" ${maxDepth>1?`rowspan="${maxDepth}"`:''}><button class="colx" data-toggle-group-collapse="${g.id}" title="Ausblenden" style="position:absolute;left:50%;top:8px;transform:translateX(-50%);display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;padding:0;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.15);border-radius:4px;color:var(--ink);">${eyeIconSvg(false)}</button></th>`];
    for(let r=0; r<maxDepth; r++){
      catRowStrings[r] += (r===0 ? groupRowSets[0] : '');
    }
    if(g.children.length === 0){
      const placeholderCell = `<th class="cat-head" ${maxDepth>1?`rowspan="${maxDepth}"`:''}><div class="colhead"><button class="colx dark" data-add-first-cat="${g.id}" style="width:auto;height:auto;padding:6px 10px;border-radius:14px;white-space:nowrap;">+ Kategorie hinzufügen</button></div></th>`;
      catRowStrings[0] += placeholderCell;
    } else {
      g.children.forEach(cat => {
        const rowSet = buildCatRows(cat, g, 0, undefined);
        for(let r=0; r<maxDepth; r++){ catRowStrings[r] += rowSet[r] || ''; }
      });
    }
  });
  const catHeaderRows = catRowStrings.map(r => `<tr>${r}</tr>`).join('');

  let body = '';
  const colCount = 2 + groups.reduce((s,g)=>s+(g.collapsed ? 1 : (g.children.length === 0 ? 2 : g.children.reduce((s2,c)=>s2+catWidth(c),0)+1)),0);
  const term = state.searchTerm.trim().toLowerCase();
  const semStudents = getSemesterStudents(cls, sem);
  let visibleStudents = term ? semStudents.filter(s=>s.name.toLowerCase().includes(term)) : semStudents;
  if(state.incognito){
    visibleStudents = state.selectedStudentId ? visibleStudents.filter(s=>s.id===state.selectedStudentId) : [];
  }
  if(!semStudents.length){
    body = `<tr><td class="name-col" colspan="${colCount}" style="color:var(--ink-soft);text-align:left;">Noch keine Schüler in ${escapeHtml(sem.name)} – unten hinzufügen.</td></tr>`;
  } else if(state.incognito && !state.selectedStudentId){
    body = `<tr><td class="name-col" colspan="${colCount}" style="color:var(--ink-soft);text-align:left;">Inkognito aktiv – erst einen Schülernamen antippen, um dessen Daten allein zu zeigen.</td></tr>`;
  } else if(!visibleStudents.length){
    body = `<tr><td class="name-col" colspan="${colCount}" style="color:var(--ink-soft);text-align:left;">Keine Treffer für "${escapeHtml(state.searchTerm)}".</td></tr>`;
  } else {
    function overrideMark(cat, g, s){
      const ov = cat.overrides && cat.overrides[s.id];
      return (borderlineEnabled && ov !== undefined && ov !== null && ov !== '') ? `<button class="reset-arrow" data-reset-cat="${cat.id}" data-group="${g.id}" data-student="${s.id}" title="Automatische Berechnung wiederherstellen"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;"><rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" stroke-width="2.2"/><rect x="7" y="5" width="10" height="4" rx="0.8" fill="currentColor"/><circle cx="7.6" cy="13.2" r="1.15" fill="currentColor"/><circle cx="12" cy="13.2" r="1.15" fill="currentColor"/><circle cx="16.4" cy="13.2" r="1.15" fill="currentColor"/><circle cx="7.6" cy="17.4" r="1.15" fill="currentColor"/><circle cx="12" cy="17.4" r="1.15" fill="currentColor"/><circle cx="16.4" cy="17.4" r="1.15" fill="currentColor"/></svg></button>` : '';
    }
    function catCell(cat, g, s, depth, baseColor, rowLighten){
      const ownColor = cat.bgColor || undefined;
      const colorCls = ownColor ? ' class="has-custom-color"' : '';
      const bgAttr = ownColor ? ` style="background:${ownColor};"` : '';
      if(cat.collapsed){
        const collapsedVal = categoryAvgForStudent(cls, cat, s.id);
        let collapsedPill = notePill(cls, collapsedVal);
        if(collapsedVal === null || collapsedVal === undefined || isNaN(collapsedVal)){
          const majoritySym = majoritySymbolForCategory(cat, s.id);
          if(majoritySym) collapsedPill = observationPill({observation: majoritySym});
        }
        return `<td class="total-col collapsed-col" data-toggle-cat-collapse="${cat.id}" data-group="${g.id}" style="cursor:pointer;text-align:center;${ownColor?`background:${ownColor};`:''}" title="Einblenden"><div class="cell-stack" style="display:flex;justify-content:center;width:100%;">${collapsedPill}</div></td>`;
      }
      const hasKids = cat.children && cat.children.length;
      const a = categoryAvgForStudent(cls, cat, s.id);
      if(hasKids){
        let pillHtml = notePill(cls, a);
        if(a === null || a === undefined || isNaN(a)){
          const majoritySym = majoritySymbolForCategory(cat, s.id);
          if(majoritySym) pillHtml = observationPill({observation: majoritySym});
        }
        const gesamtColor = ownColor ? lightenColor(ownColor, rowLighten !== undefined ? rowLighten : GRADIENT_STEP) : undefined;
        const gesamtBgAttr = gesamtColor ? ` style="background:${gesamtColor};"` : '';
        let html = `<td class="total-col"${gesamtBgAttr}><div class="cell-stack" data-open-entries data-cat="${cat.id}" data-group="${g.id}" data-student="${s.id}">${pillHtml}${overrideMark(cat, g, s)}</div></td>`;
        cat.children.forEach(child => { html += catCell(child, g, s, depth+1, undefined, rowLighten); });
        return html;
      }
      if(cat.mode === 'observation' && !isContainerCat(cat)){
        const ov = cat.overrides && cat.overrides[s.id];
        const pillHtml = (ov !== undefined && ov !== null && ov !== '') ? notePill(cls, a) : observationPill(cat.entries[s.id]);
        return `<td${colorCls}${bgAttr}><div class="cell-stack" data-open-entries data-cat="${cat.id}" data-group="${g.id}" data-student="${s.id}">${pillHtml}${overrideMark(cat, g, s)}</div></td>`;
      }
      let subLabel;
      if(cat.mode === 'points' && !isContainerCat(cat)){
        const entry = cat.entries[s.id];
        if(entry) subLabel = `${entry.points ?? '?'}/${entry.maxPoints ?? '?'}`;
      }
      return `<td${colorCls}${bgAttr}><div class="cell-stack" data-open-entries data-cat="${cat.id}" data-group="${g.id}" data-student="${s.id}">${notePill(cls, a, subLabel, cat.displayScale)}${overrideMark(cat, g, s)}</div></td>`;
    }
    visibleStudents.forEach((s, rowIdx) => {
      const end = semesterEndnoteForStudent(cls, sem, s.id);
      const overridden = sem.endnoteOverrides && sem.endnoteOverrides[s.id] !== undefined && sem.endnoteOverrides[s.id] !== '';
      const isSelected = state.selectedStudentId === s.id;
      const hasNotes = studentHasObservationNotes(sem, s.id);
      let row = `<tr class="${isSelected?'student-selected':''}"><td class="name-col${sem.studentColColor?' has-custom-color':''}" data-select-student="${s.id}" style="cursor:pointer;${sem.studentColColor?`background:${sem.studentColColor};`:''}"><div class="name-cell-row"><span>${escapeHtml(s.name)}</span>${hasNotes ? `<button class="colx dark" data-show-ub-notes="${s.id}" title="Unterrichtsbeobachtungen mit Notizen ansehen">📝</button>` : ''}<button class="colx dark" data-del-student="${s.id}" title="Aus ${escapeHtml(sem.name)} entfernen">✕</button></div></td>`;
      let endPillHtml = notePill(cls, end);
      let endBadge = '';
      if(borderlineEnabled){
        if(overridden){
          endBadge = `<span class="border-badge border-resolved" title="Grenzfall manuell entschieden">⚑</span>`;
        } else {
          const endStatus = computeBorderlineStatus(cls, end);
          if(endStatus && !endStatus.exact){
            endPillHtml = tieOnlyBadgeHtmlEndnote(endStatus, s.id);
          } else {
            endBadge = borderlineBadgeHtmlEndnote(endStatus, s.id);
          }
        }
      }
      row += `<td class="endnote-col"${sem.endnoteColor?` style="background:${sem.endnoteColor};"`:''}><div class="cell-stack" data-open-endnote="${s.id}">${endPillHtml}${endBadge}${(borderlineEnabled && overridden) ? `<button class="reset-arrow" data-reset-endnote="${s.id}" title="Automatische Berechnung wiederherstellen"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;"><rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" stroke-width="2.2"/><rect x="7" y="5" width="10" height="4" rx="0.8" fill="currentColor"/><circle cx="7.6" cy="13.2" r="1.15" fill="currentColor"/><circle cx="12" cy="13.2" r="1.15" fill="currentColor"/><circle cx="16.4" cy="13.2" r="1.15" fill="currentColor"/><circle cx="7.6" cy="17.4" r="1.15" fill="currentColor"/><circle cx="12" cy="17.4" r="1.15" fill="currentColor"/><circle cx="16.4" cy="17.4" r="1.15" fill="currentColor"/></svg></button>` : ''}</div></td>`;
      groups.forEach(g => {
        if(g.collapsed){
          const collapsedGt = groupGesamtForStudent(cls, g, s.id);
          row += `<td class="total-col collapsed-col" data-toggle-group-collapse="${g.id}" style="cursor:pointer;text-align:center;" title="Einblenden"><div class="cell-stack" style="display:flex;justify-content:center;width:100%;">${notePill(cls, collapsedGt)}</div></td>`;
          return;
        }
        const gt = groupGesamtForStudent(cls, g, s.id);
        const gOv = g.overrides && g.overrides[s.id];
        const gOverridden = gOv !== undefined && gOv !== null && gOv !== '';
        let gPillHtml = notePill(cls, gt);
        let badge = '';
        if(borderlineEnabled){
          if(gOverridden){
            badge = `<span class="border-badge border-resolved" title="Grenzfall manuell entschieden">⚑</span>`;
          } else {
            const status = computeBorderlineStatus(cls, gt);
            if(status && !status.exact){
              gPillHtml = tieOnlyBadgeHtmlGroup(status, g.id, s.id);
            } else {
              badge = borderlineBadgeHtml(status, g.id, s.id);
            }
          }
        }
        const groupColorBody = g.bgColor || colorForGroupName(g.name);
        const rowProgress = visibleStudents.length > 1 ? rowIdx / (visibleStudents.length - 1) : 0;
        const rowLighten = GRADIENT_STEP + rowProgress * ADDITIONAL_ROW_FADE;
        const groupGesamtColorBody = lightenColor(groupColorBody, rowLighten);
        row += `<td class="total-col" style="background:${groupGesamtColorBody};"><div class="cell-stack" data-open-group="${g.id}" data-student="${s.id}">${gPillHtml}${badge}${(borderlineEnabled && gOverridden) ? `<button class="reset-arrow" data-reset-group="${g.id}" data-student="${s.id}" title="Automatische Berechnung wiederherstellen"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;"><rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" stroke-width="2.2"/><rect x="7" y="5" width="10" height="4" rx="0.8" fill="currentColor"/><circle cx="7.6" cy="13.2" r="1.15" fill="currentColor"/><circle cx="12" cy="13.2" r="1.15" fill="currentColor"/><circle cx="16.4" cy="13.2" r="1.15" fill="currentColor"/><circle cx="7.6" cy="17.4" r="1.15" fill="currentColor"/><circle cx="12" cy="17.4" r="1.15" fill="currentColor"/><circle cx="16.4" cy="17.4" r="1.15" fill="currentColor"/></svg></button>` : ''}</div></td>`;
        if(g.children.length === 0){
          row += `<td></td>`;
        } else {
          g.children.forEach(cat => { row += catCell(cat, g, s, 0, undefined, rowLighten); });
        }
      });
      body += row + `</tr>`;
    });
  }

  const addRow = `<tr class="add-student-row"><td class="name-col"><input type="text" id="newStudentName" placeholder="Nachname, Vorname"></td>
    <td colspan="${colCount-1}" style="text-align:left;"><button class="small" id="addStudentBtn">Hinzufügen</button></td></tr>`;

  main.innerHTML = `<div class="grid-wrap"><table class="grid"><thead>${groupHeadRow}${catHeaderRows}</thead><tbody>${body}${addRow}</tbody></table></div>`;

  main.querySelectorAll('[data-select-student]').forEach(el=>{
    let pressTimer = null, longPressed = false, startX = 0, startY = 0;
    const clear = () => { clearTimeout(pressTimer); };
    el.addEventListener('pointerdown', (e) => {
      if(e.target.closest('[data-del-student], [data-show-ub-notes]')) return;
      longPressed = false;
      startX = e.clientX; startY = e.clientY;
      pressTimer = setTimeout(() => {
        longPressed = true;
        renameStudent(cls, el.dataset.selectStudent);
      }, 500);
    });
    el.addEventListener('pointermove', (e) => {
      if(Math.abs(e.clientX-startX) > 8 || Math.abs(e.clientY-startY) > 8) clear();
    });
    el.addEventListener('pointerup', clear);
    el.addEventListener('pointercancel', clear);
    el.onclick = (e) => {
      if(e.target.closest('[data-del-student], [data-show-ub-notes]')) return;
      if(longPressed){ longPressed = false; return; }
      const id = el.dataset.selectStudent;
      const wasSelected = state.selectedStudentId === id;
      state.selectedStudentId = wasSelected ? null : id;
      if(wasSelected && state.incognito) state.incognito = false;
      render();
    };
  });
  main.querySelectorAll('[data-toggle-incognito]').forEach(btn=>{
    btn.onclick = (e) => {
      e.stopPropagation();
      state.incognito = !state.incognito;
      render();
    };
  });
  const searchInput = document.getElementById('searchStudent');
  if(searchInput){
    if(searchWasFocused){
      searchInput.focus();
      const pos = searchInput.value.length;
      searchInput.setSelectionRange(pos, pos);
      searchWasFocused = false;
    }
    searchInput.addEventListener('input', (e) => {
      state.searchTerm = e.target.value;
      searchWasFocused = true;
      renderGrid(main, cls, sem);
    });
  }
  main.querySelectorAll('[data-show-ub-notes]').forEach(btn=>{
    btn.onclick = (e) => {
      e.stopPropagation();
      openStudentObservationsModal(cls, sem, btn.dataset.showUbNotes);
    };
  });
  main.querySelectorAll('[data-del-student]').forEach(btn=>{
    btn.onclick = async (e) => {
      e.stopPropagation();
      const id = btn.dataset.delStudent;
      const student = cls.students.find(s=>s.id===id);
      const ok = await showConfirm('Schüler entfernen', `"${student ? student.name : 'Dieser Schüler'}" aus ${sem.name} entfernen?`, {confirmLabel:'Entfernen', danger:true});
      if(!ok) return;
      sem.studentIds = sem.studentIds.filter(sid => sid !== id);
      const stillEnrolled = cls.semesters.some(sm => sm.studentIds && sm.studentIds.includes(id));
      if(!stillEnrolled){
        cls.students = cls.students.filter(s=>s.id!==id);
        function purge(c){ delete c.entries[id]; if(c.overrides) delete c.overrides[id]; if(c.children) c.children.forEach(purge); }
        cls.semesters.forEach(sm => {
          sm.groups.forEach(g => {
            if(g.overrides) delete g.overrides[id];
            g.children.forEach(purge);
          });
          if(sm.endnoteOverrides) delete sm.endnoteOverrides[id];
        });
      }
      saveState(); render();
    };
  });
  main.querySelectorAll('[data-del-group]').forEach(btn=>{
    btn.onclick = async () => {
      const g = sem.groups.find(x=>x.id===btn.dataset.delGroup);
      if(g && g.locked) return;
      const ok = await showConfirm('Gruppe löschen', 'Diese Gruppe inkl. aller Kategorien und Noten löschen?', {confirmLabel:'Löschen', danger:true});
      if(!ok) return;
      sem.groups = sem.groups.filter(g=>g.id!==btn.dataset.delGroup);
      rebalanceEqualWeights(sem.groups);
      saveState(); render();
    };
  });
  main.querySelectorAll('[data-move-group]').forEach(btn=>{
    btn.onclick = () => { moveItem(sem.groups, btn.dataset.moveGroup, parseInt(btn.dataset.dir)); saveState(); render(); };
  });
  main.querySelectorAll('[data-toggle-group-collapse]').forEach(el=>{
    el.onclick = () => {
      const g = sem.groups.find(x=>x.id===el.dataset.toggleGroupCollapse);
      if(!g) return;
      g.collapsed = !g.collapsed;
      saveState(); render();
    };
  });
  main.querySelectorAll('[data-toggle-cat-collapse]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      const ctx = findCategoryContext(sem, el.dataset.group, el.dataset.toggleCatCollapse);
      if(!ctx) return;
      ctx.cat.collapsed = !ctx.cat.collapsed;
      saveState(); render();
    };
  });
  main.querySelectorAll('[data-move-cat]').forEach(btn=>{
    btn.onclick = () => {
      const ctx = findCategoryContext(sem, btn.dataset.group, btn.dataset.moveCat);

async function promptNewFromTemplate(defaultWeight, extraOptions){
  const options = [
    {label: '📝 Note direkt eintragen', value: 'grade'},
    {label: '🔢 Klausurpunkte', value: 'points'},
    {label: '✓ Beobachtung (mit Wertung)', value: 'obs_graded'},
    {label: '✓ Beobachtung (ohne Wertung)', value: 'obs_ungraded'},
    {label: '📁 Sammelkategorie', value: 'container'},
    ...(extraOptions || []),
  ];
  const template = await showChoice('Was hinzufügen?', '', options);
  if(template === null) return null;
  if(template === 'newgroup') return {special: 'newgroup'};
  const namePrompts = {
    grade: ['Note direkt eintragen', 'z.B. Klausur 1 oder Beitrag 12.03.'],
    points: ['Klausurpunkte', 'z.B. Klausur 1'],
    obs_graded: ['Beobachtung (mit Wertung)', 'z.B. Beitrag 12.03.'],
    obs_ungraded: ['Beobachtung (ohne Wertung)', 'z.B. Beitrag 12.03.'],
    container: ['Sammelkategorie', 'z.B. Unterrichtsbeobachtungen'],
  };
  const [title, placeholder] = namePrompts[template];
  const name = await showPrompt(title, 'Name', '', {placeholder, confirmLabel:'Anlegen'});
  if(name===null || !name.trim()) return null;
  const weight = parseFloat(defaultWeight) || 0;
  switch(template){
    case 'grade':
      return {id: uid(), name: name.trim(), weight, mode:'grade', date: '', entries: {}};
    case 'points':
      return {id: uid(), name: name.trim(), weight, mode:'points', maxPoints: 100, date: '', entries: {}};
    case 'obs_graded':
      return {id: uid(), name: name.trim(), weight, mode:'observation', ungraded: false, date: '', entries: {}};
    case 'obs_ungraded':
      return {id: uid(), name: name.trim(), weight: 0, mode:'observation', ungraded: true, date: '', entries: {}};
    case 'container':
      return {id: uid(), name: name.trim(), weight, containerOnly: true, children: [], entries: {}};
  }
}
async function addCategory(cls, sem, groupId){
  const newName = await showPrompt('Neue Notengruppe', 'Name der neuen Gruppe', '', {placeholder:'z.B. Projekt', confirmLabel:'Anlegen'});
  if(newName === null || !newName.trim()) return;
  sem.groups.push({id: uid(), name: newName.trim(), weight: 0, children: []});
  rebalanceEqualWeights(sem.groups);
  saveState(); render();
}
async function addFirstCategoryToGroup(cls, sem, groupId){
  const g = sem.groups.find(x=>x.id===groupId);
  const defaultWeight = (g.name||'').trim().toLowerCase()==='schriftlich' ? '50' : '10';
  const result = await promptNewFromTemplate(defaultWeight);
  if(!result) return;
  g.children.push(result);
  saveState(); render();
}
async function addCategoryNear(cls, sem, groupId, catId){
  const ctx = findCategoryContext(sem, groupId, catId);
  if(!ctx) return;
  const { group: g, cat: clickedCat, parentCat, list } = ctx;
  const defaultWeight = (g.name||'').trim().toLowerCase()==='schriftlich' ? '50' : '10';

  const choice = await showChoice('Neue Kategorie hinzufügen', '', [
    {label: 'Daneben – Position selbst wählen', value: 'neben'},
    {label: `Darunter – als Unterkategorie von "${clickedCat.name}"`, value: 'unter'},
  ]);
  if(choice === null) return;

  if(choice === 'unter'){
    if(!clickedCat.children) clickedCat.children = [];
    const suggested = String(Math.round(100/(clickedCat.children.length+1)));
    const newChild = await promptNewFromTemplate(suggested);
    if(!newChild) return;
    clickedCat.children.push(newChild);
    rebalanceEqualWeights(clickedCat.children);
    saveState(); render();
    return;
  }

  // 'neben' – sibling within the same list (top-level children, or the same set of sub-children)
  if(!list.length){
    const newCat = await promptNewFromTemplate(defaultWeight);
    if(!newCat) return;
    list.push(newCat);
    rebalanceEqualWeights(list);
    saveState(); render();
    return;
  }
  const idx = await showChoice('Kategorie einfügen', 'Neben welcher bestehenden Kategorie soll die neue rechts eingefügt werden?',
    list.map((c,i) => ({label: c.name, value: i}))
  );
  if(idx === null) return;
  const newCat = await promptNewFromTemplate(defaultWeight);
  if(!newCat) return;
  list.splice(idx+1, 0, newCat);
  rebalanceEqualWeights(list);
  saveState(); render();
}
function cloneCategoryForDuplicate(cat){
  return {
    id: uid(), name: cat.name, weight: cat.weight, mode: cat.mode, maxPoints: cat.maxPoints,
    date: cat.date, containerOnly: cat.containerOnly || false, entries: {}, overrides: {},
    displayScale: cat.displayScale, bgColor: cat.bgColor,
    children: cat.children ? cat.children.map(cloneCategoryForDuplicate) : undefined
  };
}
async function openCategoryMenu(cls, sem, groupId, catId){
  const ctx = findCategoryContext(sem, groupId, catId);
  if(!ctx) return;
  const typeLabel = isContainerCat(ctx.cat) ? 'Sammelkategorie' : 'Leistungsdaten';
  let menuMessage = 'Was möchtest du tun?';
  if(ctx.cat.dateStart && ctx.cat.dateEnd){
    const active = isRangeActive(ctx.cat.dateStart, ctx.cat.dateEnd);
    menuMessage = `Quartal: ${formatDate(ctx.cat.dateStart)} – ${formatDate(ctx.cat.dateEnd)} (${active ? 'aktuell aktiv' : 'aktuell nicht aktiv'})\n${menuMessage}`;
  } else if(!isContainerCat(ctx.cat) && ctx.cat.date){
    menuMessage = `Datum: ${formatDate(ctx.cat.date)}\n${menuMessage}`;
  }
  const choice = await showChoice(ctx.cat.name, menuMessage, [
    {label: `${typeLabel} bearbeiten`, value: 'edit'},
    {label: `${typeLabel} duplizieren`, value: 'dup'},
    {label: `${typeLabel} löschen`, value: 'del'},
  ]);
  if(choice === null) return;
  if(choice === 'edit'){
    editCategory(cls, sem, groupId, catId);
  } else if(choice === 'dup'){
    const countStr = await showPrompt('Duplizieren', 'Wie viele Duplikate erstellen?', '1', {inputType:'number', confirmLabel:'Erstellen'});
    if(countStr === null) return;
    const count = Math.max(1, Math.round(parseFloat(countStr)) || 1);
    const idx = ctx.list.findIndex(c=>c.id===catId);
    for(let i=0; i<count; i++){
      const copy = cloneCategoryForDuplicate(ctx.cat);
      ctx.list.splice(idx+1+i, 0, copy);
    }
    rebalanceEqualWeights(ctx.list);
    saveState(); render();
  } else if(choice === 'del'){
    const ok = await showConfirm(`${typeLabel} löschen`, typeLabel === 'Sammelkategorie' ? 'Diese Sammelkategorie inkl. aller Unterkategorien und Noten löschen?' : 'Diese Leistungsdaten inkl. aller Noten löschen?', {confirmLabel:'Löschen', danger:true});
    if(!ok) return;
    const idx = ctx.list.findIndex(c=>c.id===catId);
    if(idx > -1) ctx.list.splice(idx, 1);
    rebalanceEqualWeights(ctx.list);
    saveState(); render();
  }
}
async function convertCategoryMode(cls, cat, newMode){
  if(newMode === cat.mode) return;
  if(cat.mode === 'points' && newMode === 'grade'){
    const newEntries = {};
    cls.students.forEach(st => {
      const entry = cat.entries[st.id];
      if(!entry) return;
      const v = entryValue(cls, cat, entry);
      if(v === null || v === undefined || isNaN(v)) return;
      const gradeStr = cls.gradingSystem === 'punkte' ? String(Math.round(v)) : valueToGradeStr(v);
      newEntries[st.id] = {grade: gradeStr, note: entry.note};
    });
    cat.entries = newEntries;
    cat.mode = 'grade';
  } else if(cat.mode === 'grade' && newMode === 'points'){
    const ok = await showConfirm('Zu Klausurpunkten wechseln', 'Bereits eingetragene Noten lassen sich nicht in Klausurpunkte zurückrechnen und werden dabei gelöscht.', {confirmLabel:'Trotzdem wechseln', danger:true});
    if(!ok) return;
    cat.entries = {};
    cat.mode = 'points';
  } else if(cat.mode === 'observation' && newMode === 'grade'){
    const newEntries = {};
    cls.students.forEach(st => {
      const entry = cat.entries[st.id];
      if(entry && entry.hiddenGrade) newEntries[st.id] = {grade: entry.hiddenGrade, note: entry.note};
    });
    cat.entries = newEntries;
    cat.mode = 'grade';
  } else if((cat.mode === 'grade' || cat.mode === 'points') && newMode === 'observation'){
    const ok = await showConfirm('Zu Unterrichtsbeobachtung wechseln', 'Bestehende Einträge lassen sich nicht automatisch in Beobachtungssymbole umwandeln und werden dabei gelöscht.', {confirmLabel:'Trotzdem wechseln', danger:true});
    if(!ok) return;
    cat.entries = {};
    cat.mode = 'observation';
  } else if(cat.mode === 'observation' && newMode === 'points'){
    const ok = await showConfirm('Zu Klausurpunkten wechseln', 'Bestehende Beobachtungen lassen sich nicht in Klausurpunkte umwandeln und werden dabei gelöscht.', {confirmLabel:'Trotzdem wechseln', danger:true});
    if(!ok) return;
    cat.entries = {};
    cat.mode = 'points';
  } else {
    cat.mode = newMode;
  }
}
async function editCategory(cls, sem, groupId, catId){
  const ctx = findCategoryContext(sem, groupId, catId);
  if(!ctx) return;
  while(true){
    const ctx2 = findCategoryContext(sem, groupId, catId);
    if(!ctx2) return;
    const { group: g, cat } = ctx2;
    const isContainer = isContainerCat(cat);
    const modeLabel = cat.mode==='points' ? 'Klausurpunkte' : cat.mode==='observation' ? 'Beobachtung' : 'Note';
    const scaleLabel = cat.displayScale === 'noten' ? 'Noten' : cat.displayScale === 'punkte' ? 'Punkte' : 'wie Lerngruppe';
    const options = [
      ...(isContainer ? [] : [{label: `📅 Datum hinzufügen${cat.date ? ` (${formatDate(cat.date)})` : ''}`, value: 'date'}]),
      {label: `Gewichtung ändern${cat.manualWeight?' 🔒':''}`, value: 'weight'},
      {label: 'Name ändern', value: 'name'},
      {label: `Farbe ändern${cat.bgColor?' (eigene Farbe)':''}`, value: 'color'},
      ...(isContainer ? [] : [
        {label: `Eingabeart ändern (Leistungsdaten)`, value: 'mode'},
        ...(cat.mode==='points' ? [{label: `Maximalpunktzahl (${cat.maxPoints ?? 100})`, value: 'maxpoints'}] : []),
        ...(cat.mode!=='observation' ? [{label: `Darstellung ändern (Leistungsdaten)`, value: 'scale'}] : []),
      ]),
      {label: 'Fertig', value: 'done'},
    ];
    const choice = await showChoice(isContainer ? 'Sammelkategorie bearbeiten' : 'Leistungsdaten bearbeiten', cat.name, options);
    if(choice === null || choice === 'done') return;

    if(choice === 'date'){
      const dateStr = await showPrompt('Datum', 'Datum dieser Kategorie, leer lassen zum Entfernen', cat.date || '', {inputType:'date', confirmLabel:'Speichern'});
      if(dateStr !== null){ cat.date = dateStr; saveState(); render(); }
    } else if(choice === 'weight'){
      if(cat.manualWeight){
        const unlockChoice = await showChoice('Gewichtung', `Aktuell fixiert bei ${cat.weight}%`, [
          {label: 'Neuen Wert eingeben', value: 'set'},
          {label: '🔓 Fixierung aufheben', value: 'unlock'},
        ]);
        if(unlockChoice === null) continue;
        if(unlockChoice === 'unlock'){
          delete cat.manualWeight;
          rebalanceEqualWeights(ctx2.list);
          saveState(); render();
          continue;
        }
      }
      const otherManualSum = ctx2.list.filter(c => c.id !== cat.id && c.manualWeight && !c.ungraded).reduce((s,c)=>s+(c.weight||0),0);
      const maxAllowed = Math.max(0, 100 - otherManualSum);
      const weightStr = await showPrompt('Gewichtung', `Gewichtung in % (innerhalb von "${g.name}")${otherManualSum>0?` – maximal ${maxAllowed}% möglich (andere fixierte Spalten belegen bereits ${otherManualSum}%)`:''}`, cat.weight, {inputType:'number', confirmLabel:'Speichern'});
      if(weightStr !== null){
        const newWeight = parseFloat(weightStr) || 0;
        if(newWeight > maxAllowed){
          await showAlert('Wert nicht möglich', `Maximal ${maxAllowed}% möglich, da andere fixierte Spalten bereits ${otherManualSum}% belegen. Bitte einen kleineren Wert eingeben.`);
        } else {
          cat.weight = newWeight;
          cat.manualWeight = true;
          rebalanceEqualWeights(ctx2.list);
          saveState(); render();
        }
      }
    } else if(choice === 'name'){
      const name = await showPrompt('Name', 'Name der Kategorie', cat.name, {confirmLabel:'Speichern'});
      if(name !== null && name.trim()){ cat.name = name.trim(); saveState(); render(); }
    } else if(choice === 'color'){
      const colorSiblings = ctx2.list.filter(c => c.id !== cat.id && c.bgColor);
      const colorOptions = [
        {label: 'Standardfarbe (kein Hintergrund)', value: 'default'},
        {label: cat.bgColor ? 'Farbe ändern' : 'Eigene Farbe wählen', value: 'custom'},
      ];
      if(colorSiblings.length) colorOptions.push({label: 'Wie bei…', value: 'like'});
      const colorChoice = await showChoice('Hintergrundfarbe der Spalte', cat.bgColor ? 'Aktuell: eigene Farbe' : 'Aktuell: Standard', colorOptions);
      if(colorChoice === 'default') { cat.bgColor = undefined; delete cat.autoColored; saveState(); render(); }
      else if(colorChoice === 'custom'){
        const colorVal = await pickColorDialog('Farbe für diese Spalte wählen', cat.bgColor || '#cfe8fb');
        if(colorVal !== null){ cat.bgColor = colorVal; delete cat.autoColored; saveState(); render(); }
      } else if(colorChoice === 'like'){
        const likeChoice = await showChoice('Wie bei…', 'Farbe von welcher Kategorie übernehmen?', colorSiblings.map(c => ({label: c.name, value: c.bgColor})));
        if(likeChoice !== null){ cat.bgColor = likeChoice; delete cat.autoColored; saveState(); render(); }
      }
    } else if(choice === 'mode'){
      const currentModeLabel = cat.mode==='points' ? 'Klausurpunkte (automatisch berechnet)' : cat.mode==='observation' ? 'Unterrichtsbeobachtung (− ○ +)' : 'Note direkt eintragen';
      const modeChoice = await showChoice('Eingabeart', `Aktuell: ${currentModeLabel}`, [
        {label: 'Note direkt eintragen (mit Tendenz)', value: 'grade'},
        {label: 'Klausurpunkte (Note wird automatisch berechnet)', value: 'points'},
        {label: 'Unterrichtsbeobachtung (− ○ +)', value: 'observation'},
      ]);
      if(modeChoice !== null){ await convertCategoryMode(cls, cat, modeChoice); saveState(); render(); }
    } else if(choice === 'maxpoints'){
      const maxStr = await showPrompt('Maximalpunktzahl', 'Übliche maximale Punktzahl einer Klausur in dieser Kategorie', cat.maxPoints ?? 100, {inputType:'number', confirmLabel:'Speichern'});
      if(maxStr !== null){ cat.maxPoints = parseFloat(maxStr) || cat.maxPoints; saveState(); render(); }
    } else if(choice === 'scale'){
      const currentLabel = cls.gradingSystem === 'punkte' ? 'Notenpunkte' : 'Noten mit Tendenz';
      const scaleChoice = await showChoice('Darstellung (Leistungsdaten)', 'Unabhängig vom Notenschema der Lerngruppe wählbar.', [
        {label: `Wie Lerngruppe (aktuell: ${currentLabel})`, value: ''},
        {label: 'Noten mit Tendenz (1+ bis 6)', value: 'noten'},
        {label: 'Notenpunkte (0-15)', value: 'punkte'},
      ]);
      if(scaleChoice !== null){ cat.displayScale = scaleChoice || undefined; saveState(); render(); }
    }
  }
}

function renderCategoryOverrideModal(cls, cat, student){

function collectSelectableCategories(sem){
  const list = [];
  function walk(cat, group, pathLabel){
    const label = pathLabel ? `${pathLabel} → ${cat.name}` : `${group.name} → ${cat.name}`;
    list.push({id: cat.id, label});
    if(cat.children) cat.children.forEach(child => walk(child, group, label));
  }
  sem.groups.forEach(g => { g.children.forEach(cat => walk(cat, g, null)); });
  return list;
}
function collectObservationEntriesForStudent(sem, studentId){
  const results = [];
  function walk(cat, pathLabel){
    if(cat.mode === 'observation'){
      const entry = cat.entries[studentId];
      if(entry && entry.observation){
        results.push({label: pathLabel, symbol: entry.observation, note: entry.note || '', date: cat.date || ''});
      }
    }
    if(cat.children) cat.children.forEach(child => walk(child, `${pathLabel} → ${child.name}`));
  }
  sem.groups.forEach(g => { g.children.forEach(cat => walk(cat, `${g.name} → ${cat.name}`)); });
  return results;
}

function punkteValueToNoteText(punkteVal){
  // PUNKTE_TABLE und NOTEN_TABLE haben identische Prozent-Schwellen an gleicher Stelle,
  // daher lässt sich ein Punktwert über den Index auf eine Buchstabennote zurückrechnen.
  const rounded = Math.round(punkteVal);
  let idx = PUNKTE_TABLE.findIndex(row => row.note === rounded);
  if(idx === -1){
    idx = PUNKTE_TABLE.reduce((bestIdx, row, i) => Math.abs(row.note-rounded) < Math.abs(PUNKTE_TABLE[bestIdx].note-rounded) ? i : bestIdx, 0);
  }
  return NOTEN_TABLE[idx].note;
}
function noteValueToPunkte(noteVal){
  const noteStr = valueToGradeStr(noteVal);
  const idx = NOTEN_TABLE.findIndex(row => row.note === noteStr);
  return idx > -1 ? PUNKTE_TABLE[idx].note : Math.round(15 - (noteVal-1)/5*15);
}
function convertValueScale(value, fromScale, toScale){
  if(value === null || value === undefined || isNaN(value) || fromScale === toScale) return value;
  if(fromScale === 'noten' && toScale === 'punkte') return noteValueToPunkte(value);
  if(fromScale === 'punkte' && toScale === 'noten') return gradeStrToValue(punkteValueToNoteText(value));
  return value;
}

const BORDERLINE_EPS = 0.05;
function computeBorderlineStatus(cls, value){
  if(value === null || value === undefined || isNaN(value)) return null;
  if(cls.gradingSystem === 'punkte'){
    const rounded = Math.round(value);
    if(Math.abs(value - rounded) < BORDERLINE_EPS) return {exact: true, text: String(rounded), rawValue: value};
    const floor = Math.floor(value), ceil = Math.ceil(value);
    const diffFloor = value - floor, diffCeil = ceil - value;
    const isTie = Math.abs(diffFloor - diffCeil) < BORDERLINE_EPS;
    const recommendation = isTie ? `${floor} ↑ / ${ceil} ↓` : (diffFloor < diffCeil ? `${floor} ↑` : `${ceil} ↓`);
    return {exact: false, isTie, floorText: String(floor), ceilText: String(ceil), recommendation, rawValue: value};
  }
  const steps = gradeValuesList(cls).map(v => ({text: v, val: gradeStrToValue(v)})).sort((a,b)=>a.val-b.val);
  const exactStep = steps.find(s => Math.abs(s.val - value) < BORDERLINE_EPS);
  if(exactStep) return {exact: true, text: exactStep.text, rawValue: value};
  let floor = null, ceil = null;
  for(const s of steps){
    if(s.val <= value) floor = s;
    if(s.val >= value && !ceil) ceil = s;
  }
  if(!floor || !ceil) return {exact: true, text: valueToGradeStr(value), rawValue: value};
  const diffFloor = value - floor.val, diffCeil = ceil.val - value;
  const isTie = Math.abs(diffFloor - diffCeil) < BORDERLINE_EPS;
  const recommendation = isTie ? `${floor.text} ↑ / ${ceil.text} ↓` : (diffFloor < diffCeil ? `${floor.text} ↑` : `${ceil.text} ↓`);
  return {exact: false, isTie, floorText: floor.text, ceilText: ceil.text, recommendation, rawValue: value};
}

    const note = currentNote();

        renderModal(cls, cat, student);

        renderModal(cls, cat, student);

    });

      btn.onclick = () => {
        cat.entries[student.id] = {grade: btn.dataset.chipValue, note: currentNote()};
        saveState();
        root.innerHTML = ''; render();
      };
    });
  }
  const noteInput = document.getElementById('entryNote');
  if(noteInput){
    noteInput.addEventListener('change', () => {
      if(cat.entries[student.id]) { cat.entries[student.id].note = noteInput.value; saveState(); }
    });
  }
  const clearBtn = document.getElementById('clearEntryBtn');
  if(clearBtn){
    clearBtn.onclick = async () => {
      const ok = await showConfirm('Eintrag löschen', 'Diesen Eintrag wirklich löschen?', {confirmLabel:'Löschen', danger:true});

    };

}
