const SUBTLE_PALETTE = ['#D9EAD3','#FCE5CD','#CFE8FB','#F4CCCC','#E6D6F5','#FFF2CC','#D0E8E4','#F9D9E7','#DDEBF7','#EAE3D2'];
let colorizeAttempts = 0;
function comboColorsForNumber(n){
  const rot = n % SUBTLE_PALETTE.length;
  return [...SUBTLE_PALETTE.slice(rot), ...SUBTLE_PALETTE.slice(0, rot)];
}
function parentReferenceColorFor(sem, sel){
  if(sel.type === 'group'){
    const g = sem.groups.find(x => x.id === sel.id);
    return g ? (g.bgColor || colorForGroupName(g.name)) : null;
  }
  if(sel.type === 'studentcol') return null;
  const ctx = findCategoryContext(sem, sel.groupId, sel.id);
  if(!ctx) return null;
  if(ctx.parentCat && ctx.parentCat.bgColor) return ctx.parentCat.bgColor;
  const g = sem.groups.find(x => x.id === sel.groupId);
  return g ? (g.bgColor || colorForGroupName(g.name)) : null;
}
document.getElementById('colorizeSammelBtn').onclick = () => {
  if(!state.colorizeMode) return;
  const cls = getActiveClass();
  if(!cls) return;
  if(!state.colorizeSelection.length){
    setStatus('Bitte zuerst Notengruppen/Kategorien antippen, die gefärbt werden sollen.', true);
    return;
  }
  const sem = getActiveSemester(cls);
  colorizeAttempts++;
  const familyKeyFor = (sel) => {
    if(sel.type === 'group') return 'group:' + sel.id;
    if(sel.type === 'studentcol') return 'studentcol';
    const ctx = findCategoryContext(sem, sel.groupId, sel.id);
    if(ctx && ctx.parentCat) return 'parent:' + ctx.parentCat.id;
    return 'topgroup:' + sel.groupId;
  };
  const familyOrder = [];
  const familyMembers = {};
  state.colorizeSelection.forEach(sel => {
    const key = familyKeyFor(sel);
    if(!(key in familyMembers)){ familyMembers[key] = []; familyOrder.push(key); }
    familyMembers[key].push(sel);
  });
  const combo = comboColorsForNumber(colorizeAttempts);
  familyOrder.forEach((key, idx) => {
    const members = familyMembers[key];
    let color;
    if(colorizeAttempts === 1){
      const refColor = parentReferenceColorFor(sem, members[0]);
      color = refColor ? lightenColor(refColor, 0.35) : combo[idx % combo.length];
    } else {
      color = combo[idx % combo.length];
    }
    members.forEach(sel => {
      if(sel.type === 'group'){
        const g = sem.groups.find(x => x.id === sel.id);
        if(g) g.bgColor = color;
      } else if(sel.type === 'studentcol'){
        sem.studentColColor = color;
      } else {
        const ctx = findCategoryContext(sem, sel.groupId, sel.id);
        if(ctx) ctx.cat.bgColor = color;
      }
    });
  });
  saveState(); render();
};

async function performAppUpdate(){
  try{
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg) await reg.update();
    }
  }catch(e){}
  location.reload();
}
async function checkForAppUpdate(){
  setStatus('Prüfe auf Updates …');
  try{
    const res = await fetch(window.location.pathname + '?cachebust=' + Date.now(), {cache: 'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const match = text.match(/APP_VERSION_INFO\s*=\s*'([^']+)'/);
    if(!match){ await showAlert('Prüfung fehlgeschlagen', 'Version konnte in der Serverdatei nicht gefunden werden.'); return; }
    const remoteVersion = match[1];
    if(remoteVersion === APP_VERSION_INFO){
      await showAlert('Aktuell', `Du nutzt bereits die neueste Version.\n${APP_VERSION_INFO}`);
      return;
    }
    await offerAppUpdate(remoteVersion);
  }catch(e){
    await showAlert('Prüfung fehlgeschlagen', 'Es konnte keine Verbindung zum Server hergestellt werden. Internetverbindung erforderlich.');
  }
}
async function offerAppUpdate(remoteVersion){
  const choice = await showChoice('Update verfügbar', `Installiert: ${APP_VERSION_INFO}\nNeu: ${remoteVersion}\n\nEmpfehlung: Vor dem Update ein Backup erstellen.`, [
    {label: '⬇ Backup jetzt erstellen', value: 'backup'},
    {label: 'Update sofort ausführen', value: 'update'},
    {label: 'Später erinnern', value: 'later'},
  ]);
  if(choice === 'backup'){
    exportBackup();
    const proceed = await showConfirm('Update jetzt ausführen?', 'Backup wurde heruntergeladen. Soll das Update jetzt ausgeführt werden?', {confirmLabel:'Update ausführen'});
    if(proceed) await performAppUpdate();
  } else if(choice === 'update'){
    await performAppUpdate();
  }
}
async function autoCheckForUpdateSilently(){
  if(!navigator.onLine) return;
  try{
    const res = await fetch(window.location.pathname + '?cachebust=' + Date.now(), {cache: 'no-store'});
    if(!res.ok) return;
    const text = await res.text();
    const match = text.match(/APP_VERSION_INFO\s*=\s*'([^']+)'/);
    if(!match) return;
    const remoteVersion = match[1];
    if(remoteVersion === APP_VERSION_INFO) return; // already current, stay quiet
    await offerAppUpdate(remoteVersion);
  }catch(e){
    // offline or unreachable: stay silent, no interruption
  }
}

const DEMO_LAST_NAMES = ['Müller','Schmidt','Schneider','Fischer','Weber','Meyer','Wagner','Becker','Schulz','Hoffmann','Koch','Richter'];
function demoRandomFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function demoRandomGradeStr(){
  const base = Math.floor(Math.random()*6)+1;
  const tend = base===6 ? '' : demoRandomFrom(['+','','-']);
  return base + tend;
}
function demoRandomPoints(max){ return Math.round(Math.random()*max); }
function demoRandomObservation(){ return demoRandomFrom(['+','○','-']); }
function generateDemoStudents(count){
  const students = [];
  const usedNames = new Set();
  for(let i=0; i<count; i++){
    let name;
    do { name = `${demoRandomFrom(DEMO_LAST_NAMES)}, ${demoRandomFrom(DEMO_FIRST_NAMES)}`; } while(usedNames.has(name));
    usedNames.add(name);
    students.push({id: uid(), name});
  }
  return students;
}
function demoFillEntries(cat, studentIds){
  if(cat.children && cat.children.length){
    cat.children.forEach(child => demoFillEntries(child, studentIds));
    return;
  }
  if(!cat.mode) return; // pure Sammelkategorie without a mode yet
  studentIds.forEach(sid => {
    if(cat.mode === 'points'){
      cat.entries[sid] = {points: demoRandomPoints(cat.maxPoints||100), maxPoints: cat.maxPoints||100};
    } else if(cat.mode === 'observation'){
      const entry = {observation: demoRandomObservation()};
      if(!cat.ungraded) entry.hiddenGrade = demoRandomGradeStr();
      if(Math.random() < 0.3) entry.note = 'Demo-Notiz';
      cat.entries[sid] = entry;
    } else {
      cat.entries[sid] = {grade: demoRandomGradeStr()};
    }
  });
}

function scaleTablesForPrint(){
  document.querySelectorAll('.grid-wrap').forEach(wrap => {
    wrap.style.transform = '';
    wrap.style.width = '';
    const table = wrap.querySelector('table.grid');
    if(!table) return;
    const naturalWidth = table.scrollWidth;
    const naturalHeight = table.scrollHeight;
    const targetPx = 718; // ~190mm nutzbare Breite bei A4 hochkant, 10mm Rand
    let outer = wrap.parentElement.classList.contains('print-scale-outer') ? wrap.parentElement : null;
    if(naturalWidth > targetPx){
      const scale = targetPx / naturalWidth;
      wrap.style.width = naturalWidth + 'px';
      wrap.style.maxWidth = 'none';
      wrap.style.transformOrigin = 'top left';
      wrap.style.transform = `scale(${scale})`;
      if(!outer){
        outer = document.createElement('div');
        outer.className = 'print-scale-outer';
        wrap.parentNode.insertBefore(outer, wrap);
        outer.appendChild(wrap);
      }
      outer.style.width = Math.ceil(naturalWidth * scale) + 'px';
      outer.style.height = Math.ceil(naturalHeight * scale) + 'px';
      outer.style.overflow = 'hidden';
    } else if(outer){
      outer.style.width = ''; outer.style.height = ''; outer.style.overflow = '';
    }
  });
}
function resetPrintScale(){
  document.querySelectorAll('.grid-wrap').forEach(wrap => {
    wrap.style.transform = '';
    wrap.style.width = '';
    wrap.style.maxWidth = '';
  });
  document.querySelectorAll('.print-scale-outer').forEach(outer => {
    const parent = outer.parentNode;
    while(outer.firstChild) parent.insertBefore(outer.firstChild, outer);
    parent.removeChild(outer);
  });
}
window.addEventListener('afterprint', resetPrintScale);
document.getElementById('printBtn').onclick = async () => {
  const cls = getActiveClass();
  if(!cls){ await showAlert('Keine Lerngruppe', 'Bitte zuerst eine Lerngruppe auswählen.'); return; }
  const sem = getActiveSemester(cls);
  const reportChoice = await showChoice('Drucken', 'Was möchtest du drucken?', [
    {label: 'Notenbuch (alles)', value: 'alles'},
    {label: 'Konferenztabelle (Schriftlich, Mündlich, Endnote)', value: 'konferenz'},
  ]);
  if(reportChoice === null) return;
  const methodChoice = await showChoice('Drucken', '', [
    {label: 'Direkt drucken', value: 'direct'},
    {label: 'Als PDF speichern', value: 'pdf'},
  ]);
  if(methodChoice === null) return;
  if(methodChoice === 'pdf'){
    await showAlert('Als PDF speichern', 'Im nächsten Fenster als Ziel/Drucker "Als PDF sichern" (bzw. "Auf iPad sichern" o.ä.) auswählen statt eines echten Druckers.');
  }
  const main = document.getElementById('main');
  if(reportChoice === 'konferenz'){
    try{
      main.innerHTML = printHeaderHtml(cls, sem) + renderKonferenztabelleHtml(cls, sem);
    }catch(err){
      await showAlert('Fehler', 'Konferenztabelle konnte nicht erzeugt werden: ' + err.message);
      return;
    }
  } else {
    main.insertAdjacentHTML('afterbegin', printHeaderHtml(cls, sem));
  }
  scaleTablesForPrint();
  window.print();
  let restored = false;
  const restore = () => {
    if(restored) return;
    restored = true;
    render();
    resetPrintScale();
  };
  window.addEventListener('afterprint', restore, {once: true});
  setTimeout(restore, 1500);
};
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(file) importBackup(file);
  e.target.value = '';
});
document.getElementById('csvImportFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(file) importCSV(file);
  e.target.value = '';
});

document.getElementById('schoolYearInput').addEventListener('input', (e) => { state.schoolYear = e.target.value; saveState(); });

function syncStickyOffsets(){
  const titlebar = document.querySelector('.titlebar');
  const headerApp = document.querySelector('header.app');
  const toolbar = document.querySelector('.toolbar');
  if(!titlebar || !headerApp || !toolbar) return;
  const tbH = titlebar.offsetHeight;
  headerApp.style.top = tbH + 'px';
  const hH = headerApp.offsetHeight;
  toolbar.style.top = (tbH + hH) + 'px';
}
window.addEventListener('resize', syncStickyOffsets);
(async () => {
  setStatus('Wird geladen …');
  await loadState();
  document.getElementById('schoolYearInput').value = state.schoolYear;
  render();
  syncStickyOffsets();
  autoCheckForUpdateSilently();
})();
if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
