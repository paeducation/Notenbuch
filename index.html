  {v:'22.57', items:['Neu: Bei Beobachtungen gibt es zusätzlich zu + ○ − das Symbol f (fehlt an diesem Tag, ohne Wirkung auf die Note). Verwaltung → Fehlzeiten-Warnung: einschaltbar mit einstellbarer Schwelle. Erreicht ein Schüler so viele f in einem Quartal, steht rot „FP?“ hinter seinem Namen (im Inkognito-Modus ausgeblendet).']},
  {v:'22.56', items:['Eingegebene Noten lassen sich löschen: ein erneuter Tipp auf die markierte Note (oder das Symbol) nimmt sie zurück. Bei Gesamt-, Quartals- und Endnoten fällt die Zelle damit auf den berechneten Vorschlag zurück.']},
  {v:'22.55', items:['Notiz (optional) auch bei Gesamt- und Quartalsnoten (mündlich). Zellen mit Notiz zeigen ein 📝.']},
  {v:'22.54', items:['Eingabefenster: Der Name des Schülers steht größer und fett.']},
  {v:'22.53', items:['Noteneingabe: Die Noten stehen in drei Zeilen (1 und 2, 3 und 4, 5 und 6), die Abstufungen +, ohne, - jeweils zusammen.']},
  {v:'22.52', items:['„Vorschlag automatisch übernehmen“ erscheint nur noch, wenn es einen berechneten Vorschlag gibt. Eine eingegebene Gesamtnote kann nicht mehr durch „keine Note“ ersetzt werden.']},
  {v:'22.51', items:['Noteneingabe: größere Fenster und Tasten (gut mit dem Finger zu treffen). In jedem Eingabefenster (Noten, Punkte, Beobachtungen, Sammelkategorien, Gesamtnoten) gibt es Vorheriger/Nächster und den Schalter „automatisch zum nächsten Schüler“.']},
  {v:'22.50', items:['Neue Lerngruppe: zusätzlich zum CSV-Import lässt sich die Lerngruppe aus einer Sitzplan-Datei anlegen (Schüler alphabetisch, Sitzplan wird mitgespeichert).']},
  {v:'22.49', items:['Sitzplan-Import: wahlweise fehlende Schüler direkt aus dem Plan anlegen. Die Namenserkennung ist toleranter (Groß-/Kleinschreibung, Akzente, Bindestriche, ähnliche Vornamen bei eindeutigem Nachnamen).']},
  {v:'22.48', items:['Neu: Sitzplan. Im Sitzplanmodul „Für Notenbuch exportieren“ wählen und die Datei im Notenbuch über 🪑 Sitzplan → Importieren einlesen. Der Plan zeigt Plätze und Pult wie im Raum, dazu Vermerke, NTA/LRS/IK und Strichlisten-Zähler der Schüler. Nicht erkannte Namen lassen sich per Tipp zuordnen.']},
  {v:'22.47', items:['Strichlisten: Nach einem Eintrag springt die Liste nicht mehr nach oben, sondern bleibt beim Schüler stehen.']},
  {v:'22.46', items:['Strichlisten: Das Plus rechts neben der letzten Liste öffnet jetzt ein kleines Fenster nur für die neue Liste. „Listen bearbeiten“ (alle Listen ändern, verschieben, löschen) gibt es nur noch über den Knopf oben rechts.']},
  {v:'22.45', items:['Strichlisten-Modus: Im Hintergrund sind keine anderen Spalten mehr sichtbar, nur Namen und Strichlisten. Eine neue Liste legst du mit dem Plus rechts neben der letzten Liste an.']},
  {v:'22.44', items:['Strichlisten frei anlegen: Bei eingeblendeten Strichlisten öffnet „Listen bearbeiten“ (oder ein Tipp auf einen Spaltenkopf) ein Fenster, in dem du pro Lerngruppe bis zu 6 Listen mit Kurzname, Beschreibung und Farbe anlegen, umbenennen, verschieben und löschen kannst. HA, HAu und M bleiben die Standardlisten. Die Listen werden in Vorlagen und im neuen Schuljahr übernommen.']},
  {v:'22.43', items:['Strichlisten: Spalten, Zähler und Kopfkarten sind größer, die Schrift passt besser.']},
  {v:'22.42', items:['Strichlisten: Die Einträgeliste (langer Druck) zeigt jetzt die Summe für das ganze Halbjahr neben dem Wert des Quartals. Im Beratungsblatt steht unter „Hausaufgaben und Material“ eine Zeile „Gesamt Halbjahr“.']},
  {v:'22.41', items:['Strichlisten: Bei eingeblendeten Strichlisten stehen HA, HAu und M jetzt direkt hinter dem Namen.']},
  {v:'22.40', items:['Strichlisten neu gestaltet: Die Zähler sind runde Marken (leer, bläulich, orange ab 3, rot ab 5). Bei eingeblendeten Strichlisten bleibt eine schmale Kopfzeile beim Scrollen stehen (HA, HAu und M farbig hervorgehoben), die Namensspalte bleibt links fixiert, und alle anderen Spalten sind ausgegraut und gesperrt.']},
  {v:'22.39', items:['Der „Export für externe Tabelle (Zusatztool)“ ist aus der Verwaltung entfernt.']},
  {v:'22.38', items:['Menüs neu geordnet: In der Verwaltung steht „Markierte Schüler“ jetzt ganz oben. „Struktur aus 1. HJ übernehmen“ ist aus der Werkzeugleiste in Verwaltung → Halbjahr und Schuljahr umgezogen. Spalte bearbeiten: Name, Datum, Eingabeart, Maximalpunktzahl, Gewichtung, Darstellung, Farbe.']},
  {v:'22.37', items:['Vermerke: Das Datumsfeld „Fällig am“ ist auf dem iPhone/iPad jetzt normal groß und gut antippbar.']},
  {v:'22.36', items:['Vermerke-Fenster neu geordnet: oben die Vermerke, darunter die dauerhaften Hinweise (NTA, LRS, IK). Der Begriff „Dauerhaft“ heißt jetzt „Hinweise“.']},
  {v:'22.35', items:['Neu: Dauerhafte Einträge pro Schüler: NTA (Nachteilsausgleich), LRS (Lese-Rechtschreib-Schwäche) und IK (Internationale Vorbereitungsklasse). Schüler antippen, ⚑ öffnen, Abschnitt „Dauerhaft“. Die blaue Marke steht immer am Namen, im Inkognito-Modus ist sie ausgeblendet. Im Beratungsblatt erscheinen die Einträge mit Hinweistext, in „Markierte Schüler“ als eigene Liste.']},
  {v:'22.34', items:['Vermerke: Die Schnellauswahl „Am Elternsprechtag ansprechen“ heißt jetzt „Elterngespräch notwendig“. Bereits angelegte Vermerke behalten ihren Text.']},
  {v:'22.33', items:['Vermerke: Das doppelte Datumsfeld oben entfällt. Das optionale Fälligkeitsdatum steht nur noch direkt unter jedem Vermerk.']},
  {v:'22.32', items:['Vermerke: Das Fälligkeitsdatum lässt sich jetzt auch nachträglich ändern oder eintragen. Jeder Vermerk im Fenster hat sein eigenes Datumsfeld.']},
  {v:'22.31', items:['Vermerke mit Datum: Ist das Datum erreicht oder überschritten, wird das ⚑ rot und der Vermerk als „überfällig“ bzw. „heute fällig“ gekennzeichnet. Die Übersicht „Markierte Schüler“ sortiert nach Fälligkeit. Beim Öffnen der App erscheint einmal pro Tag das Fenster „Heute fällig“ mit „Erledigt“ je Vermerk.']},
  {v:'22.30', items:['Vermerke: Das Datumsfeld steht jetzt oben („Fällig am“) und wird nach dem Anlegen eines Vermerks geleert. „Hinzufügen“ ist blass, solange kein Text eingegeben ist, und meldet „Bitte Kurztext eingeben“.']},
  {v:'22.29', items:['Fehler behoben: Die Texte der Schnellauswahl im Vermerke-Fenster waren auf manchen Geräten (Android) nicht lesbar.']},
  {v:'22.28', items:['Neu: Vermerke pro Schüler. Schüler antippen, dann ⚑ neben dem Namen: Schnellauswahl (z. B. „Feststellungsprüfung nötig“, „Am Elternsprechtag ansprechen“) oder eigener Kurztext, optional mit Datum und Dringlichkeit. Offene Vermerke zeigen ein orange (normal) oder rot (dringend) gefärbtes ⚑ am Namen, erscheinen im Beratungsblatt und gesammelt unter Verwaltung → Markierte Schüler (dort mit Haken erledigen).']},
  {v:'22.27', items:['„Was hinzufügen?“: Überschriften „Eintragsart“ und „Struktur“ trennen die Spaltentypen von der Sammelkategorie.']},
  {v:'22.26', items:['Spalten-Bearbeiten-Menü: Der doppelte „Fertig“-Eintrag in der Liste entfällt; der untere Knopf heißt jetzt „Fertig“ statt „Abbrechen“.']},
  {v:'22.25', items:['Notenschlüssel (Klausur): Wenn du die Maximalpunktzahl im Fenster änderst, erscheint „Für diese Klausur übernehmen“. Damit wird der Wert in der Klausur gespeichert.']},
  {v:'22.24', items:['Neue Lerngruppe: Im Feld „Struktur übernehmen von“ kannst du jetzt direkt eine bestehende Lerngruppe wählen, ohne vorher eine Vorlage zu sichern. Übernommen werden Kategorien, Gewichtungen und Notenschema, keine Schüler, Noten oder Zeiträume.']},
  {v:'22.23', items:['Neu: Vorlagen für neue Lerngruppen. Verwaltung → „Aktuelle Lerngruppe als Vorlage sichern“ speichert Kategorien, Gewichtungen und Notenschema (ohne Schüler, Noten und Zeiträume). Beim Anlegen einer Lerngruppe (auch per CSV) wählst du die Vorlage unter „Vorlage“. Vorlagen sind im Backup enthalten.']},
  {v:'22.22', items:['Fehler behoben: „Zeiträume → Kopieren von Lerngruppe“ schloss das Fenster ohne Wirkung. Jetzt werden die Zeiträume der gewählten Lerngruppe übernommen und im Fenster angezeigt; mit „Speichern“ werden sie gesichert.']},
  {v:'22.21', items:['Das Symbol „zählt in die Gesamtwertung“ sitzt jetzt als kleiner Haken-Kreis oben rechts im Kopf der Kategorie (leerer gestrichelter Kreis = zählt nicht).']},
  {v:'22.20', items:['Neu: Symbol Σ im Kopf jeder mündlichen Kategorie (z. B. SoMi 1, SoMi 2). Antippen nimmt die Kategorie aus der Gesamtwertung heraus (Gesamt Mündlich und Endnote), erneutes Antippen bezieht sie wieder ein. So lässt sich z. B. eine Quartalsnote aus Schriftlich und SoMi 2 anzeigen. Die Endnote-Spalte zeigt dann „Auswahl ⚠“.']},
  {v:'22.19', items:['Werkzeugleiste neu geordnet: Ansicht (Notenschema, Strichlisten, Grenzfälle) | Bearbeiten (Position, Färben, Undo) | Datei (Verwaltung, Drucken). Das Speichern-Symbol ist entfallen (Backup: Verwaltung), „Rückgängig“ heißt jetzt „Undo“.', 'Das Fragezeichen („Begriffe erklärt“) steht jetzt in der Verwaltung unter „Über die App“.', 'Der Export (Excel, externe Tabelle) liegt wieder nur in der Verwaltung; „Drucken“ enthält Drucken und Formulare.']},
  {v:'22.18', items:['Verwaltung: neu gegliedert in Sichern, Halbjahr und Schuljahr, Sicherheit, Anzeige, Über die App und Zurücksetzen („Alles zurücksetzen“ steht abgesetzt und in Rot).', 'Spalte bearbeiten: Name, Eingabeart und Maximalpunktzahl stehen jetzt oben, Gewichtung, Datum, Farbe und Darstellung darunter.']},
  {v:'22.17', items:['Menü „Drucken / Export“: Drucken, Beratungsblatt, SL-Formular und Excel-Export stehen jetzt gemeinsam in einem Menü (Excel-Export ist aus der Verwaltung hierher umgezogen).', 'Spaltenmenü: Löschen steht jetzt ganz unten, in Rot.']},
  {v:'22.16', items:['Nach jedem Update erscheint einmalig eine Übersicht der Neuerungen. Später nachlesen: Verwaltung → System → Neuerungen.']},
  {v:'22.15', items:['Strichlisten-Spalten (HA, HAu, M) etwas breiter.']},
  {v:'22.14', items:['Button „Strichlisten“ steht jetzt direkt rechts neben „Notenschema“.']},
  {v:'22.11', items:['Neu: Strichlisten für Hausaufgaben nicht gemacht (HA), unvollständig (HAu) und Material vergessen (M). Button „Strichlisten“ in der Werkzeugleiste blendet sie rechts neben dem aktiven SoMi-Quartal ein. Tippen = Eintrag mit heutigem Datum, langer Druck = Einträge ansehen, ändern, löschen.', 'Die Einträge erscheinen im Beratungsblatt des Schülers.']},
  {v:'22.9', items:['Neu: Notenschlüssel pro Klausur. Im Menü einer Klausur (Punktemodus) zeigt „Notenschlüssel“ die Punktegrenzen je Note in ganzen Punkten, mit PDF zum Drucken.']},
  {v:'22.7', items:['Lange Auswahlmenüs (z. B. Verwaltung) zeigen jetzt „weitere Punkte“ am unteren Rand; ein Tipp darauf scrollt weiter.']},
  {v:'22.6', items:['Neu im Noteneditor: Schalter „Danach nächster Schüler“ öffnet nach der Eingabe direkt den nächsten Schüler.', 'Neu: Tabellengröße (Verwaltung → System) für Beamer und iPad.', 'Speicherschutz: Die App bittet den Browser, die Daten dauerhaft zu behalten.']},
];
function versionParts(v){ return String(v).split('.').map(n => parseInt(n, 10) || 0); }
function versionCmp(a, b){
  const x = versionParts(a), y = versionParts(b);
  for(let i = 0; i < Math.max(x.length, y.length); i++){ const d = (x[i]||0) - (y[i]||0); if(d) return d; }
  return 0;
}
function currentAppVersion(){ const m = APP_VERSION_INFO.match(/v(\d+(?:\.\d+)*)/); return m ? m[1] : ''; }
function whatsNewText(sinceVersion){
  const list = CHANGELOG.filter(c => !sinceVersion || versionCmp(c.v, sinceVersion) > 0);
  return list.map(c => 'Version ' + c.v + '\n' + c.items.map(t => '• ' + t).join('\n')).join('\n\n');
}
async function showWhatsNewIfNeeded(){
  const cur = currentAppVersion();
  let last = null;
  try{ last = localStorage.getItem(WHATS_NEW_KEY); }catch(e){}
  try{ localStorage.setItem(WHATS_NEW_KEY, cur); }catch(e){}
  if(!cur) return;
  if(!last){
    // Erststart nach Einführung dieser Funktion: bestehende Nutzer sehen alles seit 22.5, ganz neue Nutzer nichts
    if(!(state.classes && state.classes.length)) return;
    last = '22.5';
  }
  if(versionCmp(cur, last) <= 0) return;
  const txt = whatsNewText(last);
  if(txt) await showAlert('Neu in diesem Update', txt);
}
const TALLY_KEY = 'notenbuch-tally-visible';
const DEFAULT_TALLY_COLS = [
  {key:'HA', label:'HA', title:'Hausaufgaben nicht gemacht', short:'Hausaufg. fehlt', color:'rot'},
  {key:'HAu', label:'HAu', title:'Hausaufgaben unvollständig', short:'unvollständig', color:'orange'},
  {key:'M', label:'M', title:'Material vergessen', short:'Material fehlt', color:'blau'},
];
const TALLY_COLORS = {
  rot:{bg:'#fde7e4', fg:'#a1281c', name:'Rot'}, orange:{bg:'#fdf0d4', fg:'#8a5a00', name:'Orange'}, blau:{bg:'#e3edfb', fg:'#1d4f9a', name:'Blau'},
  gruen:{bg:'#dff1e4', fg:'#1f6f4a', name:'Grün'}, lila:{bg:'#eee3f7', fg:'#5b2f8a', name:'Lila'}, grau:{bg:'#e9e9ec', fg:'#4a4a50', name:'Grau'},
};
const TALLY_MAX_COLS = 6;
function tallyColsOf(cls){ return (cls && cls.tallyCols && cls.tallyCols.length) ? cls.tallyCols : DEFAULT_TALLY_COLS; }
function tallyVisible(){ try{ return localStorage.getItem(TALLY_KEY) === '1'; }catch(e){ return false; } }
function setTallyVisible(on){ try{ localStorage.setItem(TALLY_KEY, on ? '1' : '0'); }catch(e){} }
function isOralGroup(g){ return /^mündlich/i.test(((g && g.name) || '').trim()); }
function isSomiCat(c){ return /^SoMi\s*\d+$/i.test((c.name || '').trim()); }
// Die Strichlisten stehen rechts neben dem SoMi-Quartal, das gerade aktiv ist (sonst zuletzt begonnenes, sonst erstes)
function tallyHostCat(sem){
  const somis = [];
  (sem.groups || []).forEach(g => (g.children || []).forEach(c => { if(isSomiCat(c)) somis.push(c); }));
  if(!somis.length) return null;
  const today = localTodayIso();
  const active = somis.find(c => c.dateStart && c.dateEnd && today >= c.dateStart && today <= c.dateEnd);
  if(active) return active;
  const started = somis.filter(c => c.dateStart && c.dateStart <= today).sort((a,b) => a.dateStart < b.dateStart ? 1 : -1);
  if(started[0]) return started[0];
  // keine Zeiträume eingetragen: das SoMi mit der jüngsten Spalte bis heute, sonst das erste
  let best = null, bestDate = '';
  somis.forEach(c => { const walk = (list) => (list || []).forEach(x => { if(x.date && x.date <= today && x.date > bestDate){ bestDate = x.date; best = c; } walk(x.children); }); walk(c.children); });
  return best || somis[0];
}
function tallyList(host, key, sid){
  return (host.tally && host.tally[key] && host.tally[key][sid]) || [];
}
function tallyEntryCount(cls, key){
  let n = 0;
  (cls.semesters || []).forEach(sem => (sem.groups || []).forEach(g => (g.children || []).forEach(c => {
    if(c.tally && c.tally[key]) Object.values(c.tally[key]).forEach(l => { n += l.length; });
  })));
  return n;
}
function openTallyNewDialog(cls){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" id="overlay"><div class="modal">
      <div class="modal-close"><button class="ghost small" id="tnCancel">Abbrechen</button></div>
      <h3>Neue Strichliste</h3>
      <div class="sub">${escapeHtml(cls.name)}</div>
      <div class="row" style="margin-top:12px;gap:8px;">
        <input type="text" id="tnLabel" maxlength="5" placeholder="Kurzname (z. B. VW)" style="width:150px;font-weight:700;">
        <select id="tnColor">${Object.entries(TALLY_COLORS).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('')}</select>
      </div>
      <input type="text" id="tnTitle" placeholder="Beschreibung (z. B. Vokabeln nicht gelernt)" style="width:100%;margin-top:8px;">
      <div class="hint" id="tnMsg" style="margin-top:6px;color:var(--danger);"></div>
      <div class="row" style="margin-top:10px;justify-content:flex-end;"><button id="tnOk">Anlegen</button></div>
    </div></div>`;
  const close = () => { root.innerHTML = ''; };
  document.getElementById('tnCancel').onclick = close;
  document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') close(); });
  const lab = document.getElementById('tnLabel'); lab.focus();
  const ok = () => {
    const label = lab.value.trim();
    if(!label){ document.getElementById('tnMsg').textContent = 'Bitte einen Kurznamen eingeben'; lab.focus(); return; }
    if(!cls.tallyCols || !cls.tallyCols.length) cls.tallyCols = DEFAULT_TALLY_COLS.map(c => ({...c}));
    if(cls.tallyCols.length >= TALLY_MAX_COLS){ close(); return; }
    cls.tallyCols.push({key: 'T' + uid(), label: label.slice(0, 5), title: document.getElementById('tnTitle').value.trim(), color: document.getElementById('tnColor').value});
    saveState(); close(); render();
  };
  document.getElementById('tnOk').onclick = ok;
  root.querySelectorAll('input').forEach(i => i.onkeydown = (e) => { if(e.key === 'Enter') ok(); });
}
function openTallyManager(cls, focusIdx){
  const root = document.getElementById('modalRoot');
  const cols = () => { if(!cls.tallyCols || !cls.tallyCols.length) cls.tallyCols = DEFAULT_TALLY_COLS.map(c => ({...c})); return cls.tallyCols; };
  const close = () => { root.innerHTML = ''; render(); };
  const draw = () => {
    const list = tallyColsOf(cls);
    root.innerHTML = `
      <div class="overlay" id="overlay"><div class="modal">
        <div class="modal-close"><button class="ghost small" id="tmClose">Fertig</button></div>
        <h3>Strichlisten bearbeiten</h3>
        <div class="sub">${escapeHtml(cls.name)} · bis zu ${TALLY_MAX_COLS} Listen</div>
        <div style="margin-top:10px;">${list.map((c, i) => `
          <div class="flag-row" style="flex-wrap:wrap;gap:6px;">
            <input type="text" data-tm-label="${i}" value="${escapeHtml(c.label)}" maxlength="5" style="width:70px;font-weight:700;" title="Kurzname">
            <input type="text" data-tm-title="${i}" value="${escapeHtml(c.title || '')}" placeholder="Beschreibung (z. B. Vokabeln fehlen)" style="flex:1 1 100%;order:5;">
            <select data-tm-color="${i}">${Object.entries(TALLY_COLORS).map(([k, v]) => `<option value="${k}"${c.color === k ? ' selected' : ''}>${v.name}</option>`).join('')}</select>
            <span style="display:inline-flex;gap:4px;margin-left:auto;">
            <button class="ghost small" data-tm-up="${i}" ${i === 0 ? 'disabled' : ''}>↑</button>
            <button class="ghost small" data-tm-down="${i}" ${i === list.length - 1 ? 'disabled' : ''}>↓</button>
            <button class="ghost small" data-tm-del="${i}" style="color:var(--danger);">✕</button>
            </span>
          </div>`).join('')}</div>
        <div class="row" style="margin-top:12px;justify-content:space-between;align-items:center;">
          <span class="hint">${list.length >= TALLY_MAX_COLS ? 'Höchstzahl erreicht.' : ''}</span>
          <button id="tmAdd" ${list.length >= TALLY_MAX_COLS ? 'disabled style="opacity:.45;"' : ''}>+ Neue Liste</button>
        </div>
      </div></div>`;
    if(focusIdx !== undefined){ const fi = root.querySelector(`[data-tm-label="${focusIdx}"]`); if(fi){ fi.focus(); fi.select(); } focusIdx = undefined; }
    document.getElementById('tmClose').onclick = close;
    document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') close(); });
    document.getElementById('tmAdd').onclick = () => { const l = cols(); if(l.length >= TALLY_MAX_COLS) return; l.push({key: 'T' + uid(), label: 'Neu', title: '', color: 'grau'}); saveState(); draw(); };
    root.querySelectorAll('[data-tm-label]').forEach(b => b.onchange = () => { const v = b.value.trim(); if(v){ cols()[+b.dataset.tmLabel].label = v.slice(0, 5); saveState(); } draw(); });
    root.querySelectorAll('[data-tm-title]').forEach(b => b.onchange = () => { const cc = cols()[+b.dataset.tmTitle]; cc.title = b.value.trim(); delete cc.short; saveState(); });
    root.querySelectorAll('[data-tm-color]').forEach(b => b.onchange = () => { cols()[+b.dataset.tmColor].color = b.value; saveState(); });
    root.querySelectorAll('[data-tm-up]').forEach(b => b.onclick = () => { const l = cols(), i = +b.dataset.tmUp; [l[i-1], l[i]] = [l[i], l[i-1]]; saveState(); draw(); });
    root.querySelectorAll('[data-tm-down]').forEach(b => b.onclick = () => { const l = cols(), i = +b.dataset.tmDown; [l[i+1], l[i]] = [l[i], l[i+1]]; saveState(); draw(); });
    root.querySelectorAll('[data-tm-del]').forEach(b => b.onclick = async () => {
      const l = cols(), i = +b.dataset.tmDel, c = l[i];
      if(l.length <= 1){ await showAlert('Nicht möglich', 'Mindestens eine Strichliste muss bleiben.'); draw(); return; }
      const n = tallyEntryCount(cls, c.key);
      const ok = await showConfirm('Liste löschen', `„${c.label}“ löschen?` + (n ? ` Dabei gehen ${n} Einträge in allen Halbjahren dieser Lerngruppe verloren.` : ''), {confirmLabel: 'Löschen', danger: true});
      if(ok){
        l.splice(i, 1);
        (cls.semesters || []).forEach(sem => (sem.groups || []).forEach(g => (g.children || []).forEach(h => { if(h.tally) delete h.tally[c.key]; })));
        saveState();
      }
      draw();
    });
  };
  draw();
}
function tallyHalfYearTotal(sem, key, sid){
  let n = 0;
  (sem.groups || []).forEach(g => (g.children || []).forEach(c => { if(c.tally) n += tallyList(c, key, sid).length; }));
  return n;
}
function tallySet(host, key, sid, list){
  host.tally = host.tally || {};
  host.tally[key] = host.tally[key] || {};
  if(list.length) host.tally[key][sid] = list.slice().sort(); else delete host.tally[key][sid];
}
function tallyPill(n){
  if(!n) return '<span class="tcnt c0">+</span>';
  return `<span class="tcnt ${n < 3 ? 'c1' : (n < 5 ? 'c3' : 'c5')}">${n}</span>`;
}
// Strichlisten-Modus: schmale, fixierte Kopfzeile (nur Namen + HA/HAu/M hervorgehoben)
function slimTallyHead(table, cls){
  const thead = table.tHead; if(!thead) return;
  const rows = Array.from(thead.rows); const grid = [];
  rows.forEach((tr, r) => { let c = 0; Array.from(tr.cells).forEach(th => {
    while(grid[r] && grid[r][c]) c++;
    const rs = th.rowSpan || 1, cs = th.colSpan || 1;
    for(let i = 0; i < rs; i++){ grid[r+i] = grid[r+i] || []; for(let j = 0; j < cs; j++) grid[r+i][c+j] = th; }
    c += cs; }); });
  const last = rows.length - 1; const n = Math.max(...grid.map(r => r.length));
  const nameTh = rows[0].querySelector('th.name-col');
  let html = '<tr>';
  let tallyHtml = '';
  for(let c = 0; c < n; c++){
    const th = grid[last] && grid[last][c];
    if(th && th.classList.contains('tally-head')){
      const col = tallyColsOf(cls).find(x => x.key === th.dataset.tkey);
      if(!col) continue;
      const cc = TALLY_COLORS[col.color] || TALLY_COLORS.grau;
      tallyHtml += `<th class="tally-head" data-tkey="${escapeHtml(col.key)}" style="cursor:pointer;"><span class="slim-hb" style="background:${cc.bg};color:${cc.fg};"><b>${escapeHtml(col.label)}</b><i>${escapeHtml(col.short || (col.title && col.title.length > 18 ? col.title.slice(0, 17) + '…' : (col.title || '')))}</i></span></th>`;
    }
  }
  const canAdd = tallyColsOf(cls).length < TALLY_MAX_COLS;
  const plusTh = canAdd ? `<th class="tally-add"><button class="ghost small" id="tallyAddBtn" title="Neue Strichliste" style="width:38px;height:38px;border-radius:50%;padding:0;font-size:1.3rem;font-weight:700;">+</button></th>` : '';
  html += (nameTh ? nameTh.outerHTML.replace(/rowspan="\d+"/, '') : '<th class="name-col"></th>') + tallyHtml + plusTh;
  thead.innerHTML = html + '</tr>';
  const tallyCount = (tallyHtml.match(/tally-head/g) || []).length;
  // Nur Namen und Strichlisten behalten, Eintragsspalten direkt hinter den Namen
  Array.from(table.tBodies[0].rows).forEach(tr => {
    if(tr.classList.contains('add-student-row')){
      const tds = tr.querySelectorAll('td'); if(tds[1]) tds[1].colSpan = tallyCount + (canAdd ? 1 : 0);
      return;
    }
    const nameTd = tr.querySelector('td.name-col'); if(!nameTd) return;
    const cells = Array.from(tr.querySelectorAll('td.tally-cell'));
    Array.from(tr.querySelectorAll('td')).forEach(td => { if(td !== nameTd && !cells.includes(td)) td.remove(); });
    let ref = nameTd; cells.forEach(td => { ref.after(td); ref = td; });
    if(canAdd) ref.insertAdjacentHTML('afterend', '<td class="tally-add-cell"></td>');
  });
  table.classList.add('tally-mode');
}

function wireTallyCells(main, cls, sem){
  main.querySelectorAll('[data-tally-cell]').forEach(td => {
    let timer = null, fired = false;
    const host = () => { let h = null; (sem.groups || []).forEach(g => (g.children || []).forEach(c => { if(c.id === td.dataset.tallyHost) h = c; })); return h; };
    const start = () => { fired = false; timer = setTimeout(() => { fired = true; const h = host(); if(h) openTallyList(cls, sem, h, td.dataset.tallyCell, td.dataset.student); }, 550); };
    const stop = () => { clearTimeout(timer); };
    td.addEventListener('pointerdown', start);
    td.addEventListener('pointerup', stop);
    td.addEventListener('pointerleave', stop);
    td.addEventListener('pointercancel', stop);
    td.addEventListener('contextmenu', (e) => e.preventDefault());
    td.addEventListener('click', () => {
      if(fired){ fired = false; return; }
      const h = host(); if(!h) return;
      const key = td.dataset.tallyCell, sid = td.dataset.student;
      tallySet(h, key, sid, [...tallyList(h, key, sid), localTodayIso()]);
      saveState(); render();
    });
  });
}

function findCategoryContext(sem, groupId, catId){
  const g = sem.groups.find(x=>x.id===groupId);
  if(!g) return null;
  function search(list, parentCat){
    for(const c of list){
      if(c.id === catId) return {group:g, cat:c, parentCat, list};
      if(c.children && c.children.length){
        const found = search(c.children, c);
        if(found) return found;
      }
    }
    return null;
  }
  return search(g.children, null);
}
function findGroupByName(sem, name){
  return sem.groups.find(g => (g.name||'').trim().toLowerCase() === name.toLowerCase());
}
function findCategoryByName(group, name){
  return group ? group.children.find(c => (c.name||'').trim().toLowerCase() === name.toLowerCase()) : null;
}

}

function excelCellForValue(cls, value, scaleOverride){
  if(value === null || value === undefined || isNaN(value)) return '';
  const effCls = scaleOverride ? {...cls, gradingSystem: scaleOverride} : cls;
  const displayVal = scaleOverride ? convertValueScale(value, cls.gradingSystem, scaleOverride) : value;
  const bucket = colorBucket(effCls, displayVal);
  return {text: displayValue(effCls, displayVal), bucket};
}

function buildFullExportData(cls, sem){
  const students = getSemesterStudents(cls, sem);
  const headers = ['Schüler', 'Endnote'];
  const colDefs = [];
  sem.groups.forEach(g => {
    headers.push(`Gesamt ${g.name}`);
    colDefs.push({type:'group', group:g});
    function walk(cat, label){
      headers.push(label);
      colDefs.push({type:'cat', cat});
      if(cat.children) cat.children.forEach(ch => walk(ch, `${label} - ${ch.name}`));
    }
    g.children.forEach(cat => walk(cat, cat.name));
  });
  const rows = students.map(s => {
    const row = [s.name, endnoteNbMark(sem, s.id) || excelCellForValue(cls, semesterEndnoteForStudent(cls, sem, s.id))];
    colDefs.forEach(def => {
      if(def.type === 'group') row.push(totalNbMark(def.group, s.id) || excelCellForValue(cls, groupGesamtForStudent(cls, def.group, s.id)));
      else row.push(excelCellForCategory(cls, def.cat, s.id));
    });
    return row;
  });
  return {headers, rows};
}
function excelFillForBucket(bucket){
  if(bucket <= 2) return {bg:'FFE4F6EC', font:'FF1F9254'};
  if(bucket <= 4) return {bg:'FFFBF0DA', font:'FFB7791F'};
  return {bg:'FFFBE7E8', font:'FFE5484D'};
}

async function downloadAsExcel(filename, sheetName, headers, rows, infoLines){
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(sheetName.slice(0,31));
  if(infoLines && infoLines.length){
    infoLines.forEach(line => { const r = ws.addRow([line]); r.font = {italic:true, size:10}; });
    ws.addRow([]);
  }
  const headerRow = ws.addRow(headers);
  headerRow.font = {bold: true};
  headerRow.eachCell(cell => { cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFEFEFEF'}}; });
  rows.forEach(cellsInRow => {
    const plainValues = cellsInRow.map(c => (c && typeof c === 'object') ? c.text : c);
    const row = ws.addRow(plainValues);
    cellsInRow.forEach((c, i) => {
      if(c && typeof c === 'object' && c.bucket !== undefined){
        const colors = excelFillForBucket(c.bucket);
        const cell = row.getCell(i+1);
        cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb: colors.bg}};
        cell.font = {color:{argb: colors.font}, bold:true};
        cell.alignment = {horizontal:'center'};
      }
    });
  });
  ws.columns.forEach(col => { col.width = 16; });
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

function pdfWinAnsi(str){
  let out = '';
  for(const ch of String(str)){
    const c = ch.codePointAt(0);
    if(c < 256){ out += String.fromCharCode(c); continue; }
    switch(c){
      case 0x2013: out += '\x96'; break;
      case 0x2014: out += '\x97'; break;
      case 0x2018: out += '\x91'; break;
      case 0x2019: out += '\x92'; break;
      case 0x201C: out += '\x93'; break;
      case 0x201D: out += '\x94'; break;
      case 0x2026: out += '\x85'; break;
      case 0x2022: out += '\x95'; break;
      case 0x20AC: out += '\x80'; break;
      case 0x2248: out += '~'; break;
      default: out += '?';
    }
  }
  return out;
}
function pdfEsc(bin){
  return bin.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
}
function MiniPdf(w, h){
  this.w = w; this.h = h; this.pages = [[]]; this.ops = this.pages[0]; this.img = null;
}
MiniPdf.prototype.addPage = function(){
  const p = [];

  this.ops = p;
};
MiniPdf.prototype.widthBin = function(bin, font, size){
  if(font === 'S') return bin.length * 0.713 * size;
  const tab = font === 'B' ? PDF_W.B : PDF_W.R;
  let sum = 0;
  for(let i = 0; i < bin.length; i++){
    const code = bin.charCodeAt(i);
    sum += code >= 32 ? (tab[code - 32] || 0) : 0;
  }
  return sum * size / 1000;
};
MiniPdf.prototype.width = function(str, font, size){
  return this.widthBin(pdfWinAnsi(str), font || 'R', size || 10);
};
MiniPdf.prototype.text = function(str, x, base, o){
  o = o || {};
  const size = o.size || 10, font = o.font || 'R';
  const bin = pdfWinAnsi(str);
  const w = this.widthBin(bin, font, size);
  let xx = x;
  if(o.align === 'center') xx = x - w / 2;
  else if(o.align === 'right') xx = x - w;
  const g = o.gray != null ? o.gray : 0;
  this.ops.push(`${g} g BT /${PDF_FONT_RES[font]} ${size} Tf ${xx.toFixed(2)} ${(this.h - base).toFixed(2)} Td (${pdfEsc(bin)}) Tj ET`);
  return w;
};
MiniPdf.prototype.line = function(x1, y1, x2, y2, lw, gray){
  this.ops.push(`${gray != null ? gray : 0} G ${lw || 0.5} w ${x1.toFixed(2)} ${(this.h - y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.h - y2).toFixed(2)} l S`);
};
MiniPdf.prototype.rect = function(x, y, w, h, o){

MiniPdf.prototype.image = function(jpegBin, pxW, pxH, x, y, w, h){

MiniPdf.prototype.build = function(){
  const objs = [];
  const hasImg = !!this.img;
  const firstPage = hasImg ? 8 : 7;
  const n = this.pages.length;
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objs[2] = `<< /Type /Pages /Kids [${this.pages.map((_, i) => (firstPage + i * 2) + ' 0 R').join(' ')}] /Count ${n} >>`;
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  objs[5] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>';
  objs[6] = '<< /Type /Font /Subtype /Type1 /BaseFont /Symbol >>';
  if(hasImg){
    objs[7] = `<< /Type /XObject /Subtype /Image /Width ${this.img.pxW} /Height ${this.img.pxH} /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /DCTDecode /Length ${this.img.bin.length} >>\nstream\n${this.img.bin}\nendstream`;
  }
  this.pages.forEach((ops, i) => {

async function sharePdf(filename, bytes, title){
  const file = new File([bytes], filename, {type: 'application/pdf'});
  const preferShare = IS_IOS || /Android/i.test(navigator.userAgent);
  if(preferShare && navigator.canShare && navigator.canShare({files: [file]})){
    try{
      await navigator.share({files: [file], title: title || filename});
      return true;
    }catch(err){
      if(err && err.name === 'AbortError') return true;
    }
  }
  const url = URL.createObjectURL(new Blob([bytes], {type: 'application/pdf'}));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return true;
}

function pdfDrawSpiegel(pdf, st, mx, R, y){
  pdf.text('Notenspiegel', mx, y + 34, {size: 14, font: 'B'});
  const slot = (R - mx) / st.spiegel.length, bw = 22, maxH = 170;
  const yb = y + 34 + 20 + maxH + 18;
  const maxCount = Math.max(...st.spiegel.map(b => b.count), 1);
  st.spiegel.forEach((b, i) => {
    const h = b.count / maxCount * maxH;
    const cx = mx + i * slot + slot / 2;
    if(h > 0) pdf.rect(cx - bw / 2, yb - h, bw, h, {fill: 0.33});
    pdf.text(String(b.count), cx, yb - h - 5, {size: 11, font: 'B', align: 'center'});
    pdf.text(b.label, cx, yb + 14, {size: 10, font: 'B', align: 'center'});
    if(st.scale === 'punkte') pdf.text(String(b.points), cx, yb + 25, {size: 8, gray: 0.45, align: 'center'});
  });
  pdf.line(mx, yb, R, yb, 1.5);
  // Tabelle
  const tRows = [['Note', st.spiegel.map(b => b.label), true]];
  if(st.scale === 'punkte') tRows.push(['Punkte', st.spiegel.map(b => String(b.points)), false]);
  tRows.push(['Anzahl', st.spiegel.map(b => String(b.count)), true]);
  const rowH = 20, c0 = 62, cw = (R - mx - c0) / st.spiegel.length;
  const ty = yb + (st.scale === 'punkte' ? 46 : 36);
  tRows.forEach((tr, ri) => {
    const yy = ty + ri * rowH;
    pdf.text(tr[0], mx + 5, yy + 14, {size: 10, font: tr[2] ? 'B' : 'R'});
    tr[1].forEach((s, ci) => pdf.text(s, mx + c0 + ci * cw + cw / 2, yy + 14, {size: 10, font: tr[2] ? 'B' : 'R', align: 'center'}));
  });
  for(let ri = 0; ri <= tRows.length; ri++) pdf.line(mx, ty + ri * rowH, R, ty + ri * rowH, 0.6, 0.45);
  pdf.line(mx, ty, mx, ty + tRows.length * rowH, 0.6, 0.45);
  pdf.line(mx + c0, ty, mx + c0, ty + tRows.length * rowH, 0.6, 0.45);
  for(let ci = 1; ci <= st.spiegel.length; ci++) pdf.line(mx + c0 + ci * cw, ty, mx + c0 + ci * cw, ty + tRows.length * rowH, 0.6, 0.45);
  return ty + tRows.length * rowH;
}

// ---------- Sitzplan (Import aus dem Sitzplanmodul, Format sitzplan-notenbuch v1) ----------
function seatNorm(t){ return String(t || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function seatNorm2(t){ return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ß/g, 'ss').replace(/[-–_.]/g, ' ').replace(/\s+/g, ' ').trim(); }
function seatSplitName(full){
  const n = String(full || '').trim();
  if(n.includes(',')){ const i = n.indexOf(','); return {nach: n.slice(0, i).trim(), vor: n.slice(i + 1).trim()}; }
  const parts = n.split(/\s+/); if(parts.length < 2) return {nach: n, vor: ''};
  return {nach: parts[parts.length - 1], vor: parts.slice(0, -1).join(' ')};
}
// Reihenfolge: gemerkte Zuordnung, exakter Name, tolerante Schreibweise, eindeutiger Nachname mit gleichem Anfangsbuchstaben des Vornamens
function seatMatchStudent(cls, nachname, vorname, prevMap, used){
  const free = x => !used || !used.has(x);
  const key = seatNorm(nachname + ', ' + vorname);
  if(prevMap && prevMap[key] && free(prevMap[key]) && cls.students.some(x => x.id === prevMap[key])) return prevMap[key];
  const cand = cls.students.filter(st => free(st.id)).map(st => ({st, ...seatSplitName(st.name)}));
  const n1 = seatNorm(nachname), v1 = seatNorm(vorname);
  let hit = cand.find(c => (seatNorm(c.nach) === n1 && seatNorm(c.vor) === v1) || seatNorm(c.st.name) === seatNorm(vorname + ' ' + nachname));
  if(hit) return hit.st.id;
  const n2 = seatNorm2(nachname), v2 = seatNorm2(vorname);
  hit = cand.find(c => seatNorm2(c.nach) === n2 && seatNorm2(c.vor) === v2);
  if(hit) return hit.st.id;
  const sameNach = cand.filter(c => seatNorm2(c.nach) === n2 && n2);
  if(sameNach.length === 1 && v2 && seatNorm2(sameNach[0].vor).charAt(0) === v2.charAt(0)) return sameNach[0].st.id;
  return null;
}
function seatParseFile(text){
  let d; try{ d = JSON.parse(text); }catch(e){ throw new Error('Die Datei ist keine gültige JSON-Datei.'); }
  if(!d || d.format !== 'sitzplan-notenbuch') throw new Error('Das ist keine Sitzplan-Datei aus dem Sitzplanmodul (Format „sitzplan-notenbuch“ erwartet).');
  if(d.version !== 1) throw new Error('Diese Sitzplan-Datei hat die Version ' + d.version + '. Unterstützt wird Version 1. Bitte Notenbuch aktualisieren.');
  if(!Array.isArray(d.tiles)) throw new Error('Die Sitzplan-Datei enthält keine Kacheln.');
  const num = (v, def) => (typeof v === 'number' && isFinite(v)) ? v : def;
  return {
    klasse: String(d.klasse || ''), typ: d.typ === 'Fachraum' ? 'Fachraum' : 'Klassenraum', fach: d.fach ? String(d.fach) : null,
    raum: String(d.raum || ''), cols: Math.max(1, Math.round(num(d.cols, 10))), rows: Math.max(1, Math.round(num(d.rows, 6))),
    exportedAt: d.exportedAt || '', updatedAt: d.updatedAt || '',
    tiles: d.tiles.map(t => t.type === 'pult'
      ? {type: 'pult', x: num(t.x, 0), y: num(t.y, 0), rotation: num(t.rotation, 0), label: String(t.label || 'PULT'), widthUnits: Math.max(1, num(t.widthUnits, 2))}
      : {type: 'student', x: num(t.x, 0), y: num(t.y, 0), rotation: num(t.rotation, 0), vorname: String(t.vorname || ''), nachname: String(t.nachname || '')})
  };
}
async function importSeatPlanFile(cls, file, opts){
  opts = opts || {};
  let parsed;
  try{ parsed = seatParseFile(await file.text()); }
  catch(e){ await showAlert('Import nicht möglich', e.message); return false; }
  if(!opts.skipClassCheck && parsed.klasse && seatNorm(parsed.klasse) !== seatNorm(cls.name)){
    const ok = await showConfirm('Andere Lerngruppe?', `Der Sitzplan gehört zu „${parsed.klasse}“, du importierst ihn in „${cls.name}“. Trotzdem importieren?`, {confirmLabel: 'Importieren'});
    if(!ok) return false;
  }
  const mode = opts.mode || await showChoice('Wie importieren?', `Sitzplan „${parsed.raum}“ mit ${parsed.tiles.filter(t => t.type === 'student').length} Schülerplätzen.`, [
    {label: 'Nur Plan anzeigen', value: 'plan'},
    {label: 'Plan anzeigen und fehlende Schüler anlegen', value: 'fill'},
  ]);
  if(!mode) return false;
  if(!cls.seatPlans) cls.seatPlans = [];
  const sameIdx = cls.seatPlans.findIndex(p => p.raum === parsed.raum && p.typ === parsed.typ && (p.fach || '') === (parsed.fach || ''));
  const prevMap = {};
  if(sameIdx >= 0) cls.seatPlans[sameIdx].tiles.forEach(t => { if(t.type === 'student' && t.sid) prevMap[seatNorm(t.nachname + ', ' + t.vorname)] = t.sid; });
  const used = new Set();
  const studs = parsed.tiles.filter(t => t.type === 'student');
  studs.forEach(t => { t.sid = (t.vorname || t.nachname) ? seatMatchStudent(cls, t.nachname, t.vorname, prevMap, used) : null; if(t.sid) used.add(t.sid); });
  let created = 0, dupes = 0;
  if(mode === 'fill'){
    const missing = studs.filter(t => !t.sid && (t.vorname || t.nachname));
    const seen = new Set(), toAdd = [];
    missing.forEach(t => { const k = seatNorm2(t.nachname + ',' + t.vorname); if(seen.has(k)){ dupes++; } else { seen.add(k); toAdd.push(t); } });
    if(toAdd.length){
      const ok = await showConfirm('Schüler anlegen?', `${toAdd.length} neue Schüler anlegen, ${used.size} sind schon vorhanden:\n${toAdd.slice(0, 8).map(t => t.nachname + ', ' + t.vorname).join('\n')}${toAdd.length > 8 ? '\n…' : ''}`, {confirmLabel: 'Anlegen'});
      if(!ok) return false;
      const wasEmpty = cls.students.length === 0;
      toAdd.forEach(t => {
        const name = t.vorname ? `${t.nachname}, ${t.vorname}` : t.nachname;
        const st = {id: uid(), name};
        cls.students.push(st);
        cls.semesters.forEach(sm => { if(!sm.studentIds) sm.studentIds = []; sm.studentIds.push(st.id); });
        t.sid = st.id; created++;
      });
      if(wasEmpty){
        const byName = (a, b) => String(a.name).localeCompare(String(b.name), 'de');
        cls.students.sort(byName);
        cls.semesters.forEach(sm => { sm.studentIds = cls.students.map(x => x.id).filter(id => (sm.studentIds || []).includes(id)); });
      }
    }
  }
  const plan = {id: sameIdx >= 0 ? cls.seatPlans[sameIdx].id : uid(), klasse: parsed.klasse, typ: parsed.typ, fach: parsed.fach, raum: parsed.raum, cols: parsed.cols, rows: parsed.rows, exportedAt: parsed.exportedAt, updatedAt: parsed.updatedAt, importedAt: new Date().toISOString(), tiles: parsed.tiles};
  if(sameIdx >= 0) cls.seatPlans[sameIdx] = plan; else cls.seatPlans.push(plan);
  cls.activeSeatPlanId = plan.id;
  saveState();
  const open = plan.tiles.filter(t => t.type === 'student' && !t.sid);
  const msg = [];
  if(created) msg.push(`${created} Schüler neu angelegt.`);
  if(open.length) msg.push(`${open.length} Platz/Plätze nicht zugeordnet (${open.slice(0, 4).map(t => (t.nachname + ', ' + t.vorname).replace(/^, |, $/g, '')).join('; ')}${open.length > 4 ? ' …' : ''}). Tippe im Sitzplan auf einen gestrichelten Platz, um ihn zuzuordnen.${dupes ? ' Doppelte Namen im Plan wurden nur einmal angelegt.' : ''}`);
  if(msg.length) await showAlert('Sitzplan importiert', msg.join('\n'));
  return true;
}

const seatUi = {mode: 'view', catId: null, key: null, gradeCatId: null};
function seatObsCats(sem){

      (cat.children || []).forEach(ch => walk(ch, path + ' → ' + ch.name, cat));

function seatGradeCats(sem){

function absenceQuarters(sem, sid){

    const quarter = q || (isSomiCat(cat) ? cat : null);
    if(!isContainerCat(cat)){
      const e = cat.entries && cat.entries[sid];
      if(e && !e.absReset && ((cat.mode === 'observation' && e.observation === 'f') || (cat.mode !== 'observation' && entryMark(e) === 'f'))){

}

    root.querySelectorAll('[data-fdate]').forEach(b => b.onchange = () => { const f = list().find(x => x.id === b.dataset.fdate); if(f){ f.date = b.value || ''; saveState(); draw(); } });
    root.querySelectorAll('[data-fdel]').forEach(b => b.onclick = () => { cls.flags[sid] = list().filter(x => x.id !== b.dataset.fdel); saveState(); draw(); });
  };
  draw();
}

function buildStudentSheetPdf(cls, semesters, student, opts){
  const pdf = new MiniPdf(595.28, 841.89);
  const mx = 42.52, R = 595.28 - mx, bottom = 841.89 - 52;
  const today = new Date().toLocaleDateString('de-DE');
  const sid = student.id;
  const symText = (sym) => sym === '○' ? 'o' : sym;
  const fmtW = (w) => (Math.abs(w - Math.round(w)) < 0.05 ? String(Math.round(w)) : w.toFixed(1).replace('.', ',')) + ' %';
  const fmtAvg = (v) => (v === null || v === undefined || isNaN(v)) ? '' : (cls.gradingSystem === 'punkte' ? v.toFixed(1) : v.toFixed(2)).replace('.', ',');
  let y = 0;
  let curSem = null;
  const ensure = (h) => { if(y + h > bottom){ pdf.addPage(); y = 50; } };
  // Kopf
  pdf.text('Beratungsblatt', mx, 58, {size: 20, font: 'B'});
  pdf.text(student.name, mx, 82, {size: 15, font: 'B'});
  const kuerzel = cls.slForm && cls.slForm.kuerzel ? ' · Lehrkraft: ' + cls.slForm.kuerzel : '';
  pdf.text(`Lerngruppe: ${cls.name} · Schuljahr: ${classYear(cls) || '–'} · Stand: ${today}${kuerzel}`, mx, 99, {size: 9.5, gray: 0.3});
  pdf.line(mx, 107, R, 107, 0.7, 0.6);
  y = 124;
  const pdfFlags = studentOpenFlags(cls, sid);
  if(pdfFlags.length){
    pdf.text('Vermerke', mx + 2, y + 11, {size: 11.5, font: 'B'});
    pdf.line(mx, y + 16, R, y + 16, 0.8, 0.5);
    y += 24;
    pdfFlags.forEach(f => {
      ensure(16);
      const t = '- ' + f.text + (f.date ? '  (' + formatDate(f.date) + ')' : '');
      pdf.text(pdfFit(pdf, t, R - mx - 12, 10, 'R'), mx + 6, y + 10, {size: 10});
      y += 15;
    });
    y += 12;
  }
  const pdfPerm = studentPermTags(cls, sid);
  if(pdfPerm.length){
    pdf.text('Hinweise', mx + 2, y + 11, {size: 11.5, font: 'B'});
    pdf.line(mx, y + 16, R, y + 16, 0.8, 0.5);
    y += 24;
    pdfPerm.forEach(t => {
      ensure(16);
      pdf.text(pdfFit(pdf, '- ' + t.key + ' (' + t.label + ')' + (t.text ? ': ' + t.text : ''), R - mx - 12, 10, 'R'), mx + 6, y + 10, {size: 10});
      y += 15;
    });
    y += 12;
  }
  const notes = [];
  const catText = (cat, g) => {
    const mk = studentMark(cat, sid) || totalNbMark(cat, sid);
    if(mk) return mk;
    if(!isContainerCat(cat) && cat.mode === 'observation'){
      const e = cat.entries && cat.entries[sid];
      return e && e.observation ? symText(e.observation) : '–';
    }
    const v = categoryAvgForStudent(cls, cat, sid);
    let t = gradeTextForPdf(cls, v, cat.displayScale);
    if(t === '–' && isContainerCat(cat)){
      const maj = majoritySymbolForCategory(cat, sid);
      if(maj) t = symText(maj);
    }
    if(!isContainerCat(cat) && cat.mode === 'points'){
      const e = cat.entries && cat.entries[sid];
      if(e && e.points !== undefined && e.points !== '' && t !== '–') t += `  (${e.points}/${e.maxPoints ?? cat.maxPoints ?? '?'} P.)`;
    }
    return fpText(t, cat, sid);
  };
  const drawCat = (cat, g, depth) => {
    ensure(17);
    const container = isContainerCat(cat);
    const x0 = mx + 6 + depth * 12;
    const dateTxt = cat.date ? '  ' + (cat.mode === 'observation' ? formatDateShort(cat.date) : formatDate(cat.date)) : '';
    const noteTxt = catText(cat, g);
    const noteW = pdf.width(noteTxt, container ? 'B' : 'R', 10.5);
    const nameMax = R - 150 - x0;
    const nm = pdfFit(pdf, cat.name, nameMax - 70, 10, container ? 'B' : 'R');
    const w1 = pdf.text(nm, x0, y + 11, {size: 10, font: container ? 'B' : 'R'});
    if(dateTxt) pdf.text(dateTxt, x0 + w1, y + 11, {size: 8.5, gray: 0.5});
    if(opts.weights){
      const wt = (cat.ungraded || cat.mode === 'observation' && cat.ungraded) ? '–' : (cat.weight ? fmtW(cat.weight) : '–');
      pdf.text(wt, R - 92, y + 11, {size: 9, gray: 0.45, align: 'right'});
    }
    pdf.text(noteTxt, R - 4, y + 11, {size: 10.5, font: container ? 'B' : 'R', align: 'right'});
    pdf.line(mx, y + 15, R, y + 15, 0.3, 0.85);
    const e = !container && cat.entries && cat.entries[sid];
    if(opts.notes && e && e.note) notes.push({name: cat.name, date: cat.date, text: e.note, sem: curSem ? curSem.name : ''});
    y += 17;
    if(container) (cat.children || []).forEach(ch => drawCat(ch, g, depth + 1));
  };
  semesters.forEach(sem => {
    curSem = sem;
    ensure(70);
    const end = semesterEndnoteForStudent(cls, sem, sid);
    const endTxt = endnoteNbMark(sem, sid) || gradeTextForPdf(cls, end);
    pdf.rect(mx, y, R - mx, 22, {fill: 0.9});
    pdf.text(sem.name, mx + 8, y + 15, {size: 12, font: 'B'});
    const avgEnd = endnoteNbMark(sem, sid) ? '' : fmtAvg(end);
    let ex = R - 8;
    pdf.text('Endnote: ' + endTxt, ex, y + 15, {size: 12, font: 'B', align: 'right'});
    if(avgEnd) pdf.text('(Ø ' + avgEnd + ')', ex - pdf.width('Endnote: ' + endTxt, 'B', 12) - 6, y + 15, {size: 9, gray: 0.4, align: 'right'});
    y += 32;
    (sem.groups || []).forEach(g => {
      ensure(40);
      const gv = groupGesamtForStudent(cls, g, sid);
      let gTxt = totalNbMark(g, sid) || fpText(gradeTextForPdf(cls, gv), g, sid);
      const gnW = pdf.text(g.name, mx + 2, y + 11, {size: 11.5, font: 'B'});
      if(opts.weights && g.weight) pdf.text('(' + fmtW(g.weight) + ')', mx + 2 + gnW + 6, y + 11, {size: 9, gray: 0.45});
      pdf.text('Gesamt: ' + gTxt, R - 4, y + 11, {size: 11, font: 'B', align: 'right'});
      if(!totalNbMark(g, sid) && fmtAvg(gv)) pdf.text('Ø ' + fmtAvg(gv), R - 4 - pdf.width('Gesamt: ' + gTxt, 'B', 11) - 6, y + 11, {size: 8.5, gray: 0.4, align: 'right'});
      pdf.line(mx, y + 16, R, y + 16, 0.8, 0.5);
      y += 20;
      (g.children || []).forEach(ch => drawCat(ch, g, 0));
      y += 8;
    });
    const tallyHosts = [];
    (sem.groups || []).forEach(g => (g.children || []).forEach(c => {
      if(c.tally && tallyColsOf(cls).some(t => tallyList(c, t.key, sid).length)) tallyHosts.push(c);
    }));
    if(tallyHosts.length){
      ensure(60);
      pdf.text('Strichlisten', mx + 2, y + 11, {size: 11.5, font: 'B'});
      pdf.line(mx, y + 16, R, y + 16, 0.8, 0.5);
      y += 22;
      tallyHosts.forEach(h => {
        tallyColsOf(cls).forEach(t => {
          const l = tallyList(h, t.key, sid);
          if(!l.length) return;
          const head = `${h.name} · ${t.title ? t.title + ' (' + t.label + ')' : t.label}: ${l.length} – `;
          const lines = pdfWrap(pdf, head + l.map(d => formatDate(d).slice(0, 6)).join(', '), R - mx - 8, 9.5, 'R');
          ensure(lines.length * 12 + 6);
          lines.forEach(ln => { pdf.text(ln, mx + 4, y + 9, {size: 9.5}); y += 12; });
          y += 3;
        });
      });
      const totals = tallyColsOf(cls).map(t => ({t, n: tallyHalfYearTotal(sem, t.key, sid)})).filter(x => x.n);
      if(totals.length){
        ensure(16);
        pdf.text(`Gesamt ${sem.name}: ` + totals.map(x => `${x.t.label} ${x.n}`).join(' · '), mx + 4, y + 9, {size: 9.5, font: 'B'});
        y += 14;
      }
      y += 6;
    }
    y += 6;
  });
  if(opts.notes && notes.length){
    ensure(90);
    pdf.text('Notizen', mx, y + 12, {size: 12, font: 'B'});
    pdf.line(mx, y + 17, R, y + 17, 0.8, 0.5);
    y += 26;
    notes.forEach(n => {
      const head = (semesters.length > 1 ? n.sem + ' · ' : '') + n.name + (n.date ? ' (' + formatDate(n.date) + ')' : '') + ': ';
      const lines = pdfWrap(pdf, head + n.text, R - mx - 8, 9.5, 'R');
      ensure(lines.length * 12 + 6);
      lines.forEach((ln, i) => { pdf.text(ln, mx + 4, y + 9, {size: 9.5}); y += 12; });
      y += 4;
    });
  }
  // Fußzeile mit Seitenzahl
  const total = pdf.pages.length;
  pdf.pages.forEach((ops, i) => {
    pdf.ops = ops;
    pdf.text(`Beratungsblatt · ${student.name}`, mx, 841.89 - 28, {size: 8, gray: 0.5});
    pdf.text(`Seite ${i + 1} von ${total}`, R, 841.89 - 28, {size: 8, gray: 0.5, align: 'right'});
  });
  return pdf.build();
}

function printViaOverlay(bodyHtml, css, pageCss){
  const body = document.body;
  let ov = document.getElementById('printOverlay');
  if(!ov){ ov = document.createElement('div'); ov.id = 'printOverlay'; body.appendChild(ov); }
  ov.innerHTML = bodyHtml;
  const old = document.getElementById('printOverlayStyle');
  if(old) old.remove();
  const st = document.createElement('style');
  st.id = 'printOverlayStyle';
  st.textContent = `@page{${pageCss}}\n@media print{${css}}`;
  document.head.appendChild(st);
  body.classList.add('printing-overlay');
  const started = Date.now();
  let done = false;
  const cleanup = () => {
    if(done) return;
    done = true;
    window.removeEventListener('afterprint', onAfter);
    body.classList.remove('printing-overlay');
    ov.innerHTML = '';
    st.remove();
  };
  // iOS meldet "afterprint" teils sofort – daher mindestens 2,5 s warten, bevor aufgeräumt wird
  const onAfter = () => setTimeout(cleanup, Math.max(0, 2500 - (Date.now() - started)));
  window.addEventListener('afterprint', onAfter);
  setTimeout(cleanup, 20000);
  window.print();
  return true;
}

    const isSelected = state.colorizeMode && isColorizeSelected('cat', cat.id);

    const selectMark = isSelected ? ' ✓' : '';
    const bgStyle = levelColor ? `background:${levelColor};` : '';
    const nameRow = `<div class="row" style="gap:4px;align-items:center;justify-content:center;">
      <span data-edit-cat="${cat.id}" data-group="${g.id}" title="Antippen: bearbeiten, duplizieren oder löschen">${dateRangeDotHtml(cat)}${escapeHtml(cat.name)}${selectMark}</span>
    </div>`;
    if(cat.collapsed){
      const isContainer = cat.children && cat.children.length;
      const collapsedEye = isContainer ? `<button class="colx dark" data-toggle-cat-collapse="${cat.id}" data-group="${g.id}" title="Einblenden" style="display:inline-flex;align-items:center;justify-content:center;padding:0;width:16px;height:16px;">${eyeIconSvg(true)}</button>` : '';
      return `<th class="cat-head collapsed-col" style="${bgStyle}${selectStyle}" ${rowspan>1?`rowspan="${rowspan}"`:''} colspan="1">
        <div class="colhead" data-select-cat="${cat.id}" data-group="${g.id}" style="flex-direction:column;gap:6px;padding:4px 0;width:32px;max-width:32px;overflow:hidden;margin:0 auto;">
          <span data-edit-cat="${cat.id}" data-group="${g.id}" title="Antippen: bearbeiten, duplizieren oder löschen" style="writing-mode:vertical-rl;font-size:0.68rem;cursor:pointer;">${dateRangeDotHtml(cat)}${escapeHtml(cat.name)}${selectMark}</span>
          ${collapsedEye}
        </div>
      </th>`;
    }
    const countBtn = (depth === 0 && (g.name || '').trim().toLowerCase() !== 'schriftlich')
      ? `<button class="count-toggle${cat.excluded ? ' off' : ''}" data-toggle-count="${cat.id}" data-group="${g.id}" title="${cat.excluded ? 'Zählt nicht in die Gesamtwertung (antippen: wieder einbeziehen)' : 'Zählt in die Gesamtwertung (antippen: ausnehmen)'}">${cat.excluded ? '' : '✓'}</button>` : '';
    return `<th class="cat-head" style="${bgStyle}${selectStyle}" ${rowspan>1?`rowspan="${rowspan}"`:''} colspan="${colspan}">
      <div class="colhead${countBtn ? ' has-count-toggle' : ''}" data-select-cat="${cat.id}" data-group="${g.id}">
        ${countBtn}
        ${nameRow}
        <span class="weight">${cat.excluded ? 'zählt nicht' : cat.weight + '%'}${cat.manualWeight && !cat.excluded ? lockIconSvg() : ''}${isContainerCat(cat) ? '' : ' · '+(cat.mode==='points'?'Punkte':'Note')}</span>
        ${(cat.date && !isContainerCat(cat)) ? `<span class="weight">${cat.mode === 'observation' ? formatDateShort(cat.date) : formatDate(cat.date)}</span>` : ''}
        <div class="row" style="gap:2px;">
          ${state.positionMode ? `<button class="colx dark" data-move-cat="${cat.id}" data-group="${g.id}" data-dir="-1">‹</button>` : ''}
          <button class="colx dark" data-add-near-cat="${cat.id}" data-group="${g.id}" style="font-size:1.15rem;font-weight:700;width:24px;height:24px;">+</button>
          ${state.positionMode ? `<button class="colx dark" data-move-cat="${cat.id}" data-group="${g.id}" data-dir="1">›</button>` : ''}
        </div>
      </div>
    </th>`;
  }
  // Build one row-string per depth level (0..maxDepth-1) for a category subtree, recursively.
  // baseColor is inherited from the parent (or the group) unless this category has its own
  // bgColor; each nesting level gets a progressively lighter shade of that base color.
  function buildCatRows(cat, g, depth, baseColor){
    const rowsNeeded = maxDepth - depth;
    const rows = new Array(rowsNeeded).fill('');
    const hasKids = !cat.collapsed && cat.children && cat.children.length;
    const ownColor = cat.bgColor || undefined;
    rows[0] = catHeaderCell(cat, g, catWidth(cat), hasKids ? 1 : rowsNeeded, depth, ownColor);
    if(hasKids){
      const gesamtRowspan = rowsNeeded - 1;
      const gesamtColor = ownColor ? lightenColor(ownColor, GRADIENT_STEP) : undefined;
      const eyeBtn = `<button class="colx" data-toggle-cat-collapse="${cat.id}" data-group="${g.id}" title="${cat.collapsed?'Einblenden':'Ausblenden'}" style="position:absolute;left:50%;top:8px;transform:translateX(-50%);display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;padding:0;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.15);border-radius:4px;color:var(--ink);">${eyeIconSvg(false)}</button>`;
      const gesamtCell = `<th class="cat-head total-head" ${gesamtRowspan>1?`rowspan="${gesamtRowspan}"`:''} style="position:relative;${gesamtColor?`background:${gesamtColor};`:''}">${eyeBtn}</th>`;
      const childRowSets = cat.children.map(child => buildCatRows(child, g, depth+1, undefined));
      for(let r=0; r<rowsNeeded-1; r++){
        let content = (r===0 ? gesamtCell : '');
        childRowSets.forEach(set => { content += set[r] || ''; });
        rows[r+1] = content;
      }
    }
    return rows;
  }

  const catRowStrings = new Array(maxDepth).fill('');
  groups.forEach(g => {
    if(g.collapsed) return;
    const groupColor = g.bgColor || colorForGroupName(g.name);
    const groupGesamtColor = lightenColor(groupColor, GRADIENT_STEP);
    const groupRowSets = [`<th class="cat-head total-head" style="background:${groupGesamtColor};position:relative;" ${maxDepth>1?`rowspan="${maxDepth}"`:''}><button class="colx" data-toggle-group-collapse="${g.id}" title="Ausblenden" style="position:absolute;left:50%;top:8px;transform:translateX(-50%);display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;padding:0;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.15);border-radius:4px;color:var(--ink);">${eyeIconSvg(false)}</button></th>`];
    for(let r=0; r<maxDepth; r++){
      catRowStrings[r] += (r===0 ? groupRowSets[0] : '');
    }
    if(g.children.length === 0){
      const placeholderCell = `<th class="cat-head" ${maxDepth>1?`rowspan="${maxDepth}"`:''}><div class="colhead"><button class="colx dark" data-add-first-cat="${g.id}" style="width:auto;height:auto;padding:6px 10px;border-radius:14px;white-space:nowrap;">+ Kategorie hinzufügen</button></div></th>`;
      catRowStrings[0] += placeholderCell;
    } else {
      g.children.forEach(cat => {
        const rowSet = buildCatRows(cat, g, 0, undefined);
        for(let r=0; r<maxDepth; r++){ catRowStrings[r] += rowSet[r] || ''; }
        if(tallyHost && cat === tallyHost) catRowStrings[0] += tallyHeadHtml(cat, maxDepth, cls);
      });
    }
  });
  const catHeaderRows = catRowStrings.map(r => `<tr>${r}</tr>`).join('');

  let body = '';
  const colCount = 2 + groups.reduce((s,g)=>s+(g.collapsed ? 1 : (g.children.length === 0 ? 2 : g.children.reduce((s2,c)=>s2+catWidth(c),0)+1+(tallyHost && g.children.includes(tallyHost) ? tallyColsOf(cls).length : 0))),0);
  const term = state.searchTerm.trim().toLowerCase();
  const semStudents = getSemesterStudents(cls, sem);
  let visibleStudents = term ? semStudents.filter(s=>s.name.toLowerCase().includes(term)) : semStudents;
  if(state.incognito){
    visibleStudents = state.selectedStudentId ? visibleStudents.filter(s=>s.id===state.selectedStudentId) : [];
  }
  if(!semStudents.length){
    body = `<tr><td class="name-col" colspan="${colCount}" style="color:var(--ink-soft);text-align:left;">Noch keine Schüler in ${escapeHtml(sem.name)} – unten hinzufügen.</td></tr>`;
  } else if(state.incognito && !state.selectedStudentId){
    body = `<tr><td class="name-col" colspan="${colCount}" style="color:var(--ink-soft);text-align:left;">Inkognito aktiv – erst einen Schülernamen antippen, um dessen Daten allein zu zeigen.</td></tr>`;
  } else if(!visibleStudents.length){
    body = `<tr><td class="name-col" colspan="${colCount}" style="color:var(--ink-soft);text-align:left;">Keine Treffer für "${escapeHtml(state.searchTerm)}".</td></tr>`;
  } else {
    function overrideMark(cat, g, s){
      const ov = cat.overrides && cat.overrides[s.id];
      return (borderlineEnabled && ov !== undefined && ov !== null && ov !== '') ? `<button class="reset-arrow" data-reset-cat="${cat.id}" data-group="${g.id}" data-student="${s.id}" title="Automatische Berechnung wiederherstellen"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;"><rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" stroke-width="2.2"/><rect x="7" y="5" width="10" height="4" rx="0.8" fill="currentColor"/><circle cx="7.6" cy="13.2" r="1.15" fill="currentColor"/><circle cx="12" cy="13.2" r="1.15" fill="currentColor"/><circle cx="16.4" cy="13.2" r="1.15" fill="currentColor"/><circle cx="7.6" cy="17.4" r="1.15" fill="currentColor"/><circle cx="12" cy="17.4" r="1.15" fill="currentColor"/><circle cx="16.4" cy="17.4" r="1.15" fill="currentColor"/></svg></button>` : '';
    }
    function catCell(cat, g, s, depth, baseColor, rowLighten){
      const ownColor = cat.bgColor || undefined;
      const colorCls = ownColor ? ' class="has-custom-color"' : '';
      const bgAttr = ownColor ? ` style="background:${ownColor};"` : '';
      if(cat.collapsed){
        const collapsedVal = categoryAvgForStudent(cls, cat, s.id);
        let collapsedPill = notePill(cls, collapsedVal);
        if(collapsedVal === null || collapsedVal === undefined || isNaN(collapsedVal)){
          const majoritySym = majoritySymbolForCategory(cat, s.id);
          if(majoritySym) collapsedPill = observationPill({observation: majoritySym});
        }
        if(totalNbMark(cat, s.id)) collapsedPill = markPillHtml('NB'); else collapsedPill = applyFp(collapsedPill, cat, s.id, collapsedVal);
        return `<td class="total-col collapsed-col" data-toggle-cat-collapse="${cat.id}" data-group="${g.id}" style="cursor:pointer;text-align:center;${ownColor?`background:${ownColor};`:''}" title="Einblenden"><div class="cell-stack" style="display:flex;justify-content:center;width:100%;">${collapsedPill}</div></td>`;
      }
      const hasKids = cat.children && cat.children.length;
      const a = categoryAvgForStudent(cls, cat, s.id);
      if(hasKids){
        let pillHtml = notePill(cls, a);
        if(a === null || a === undefined || isNaN(a)){
          const majoritySym = majoritySymbolForCategory(cat, s.id);
          if(majoritySym) pillHtml = observationPill({observation: majoritySym});
        }
        if(totalNbMark(cat, s.id)) pillHtml = markPillHtml('NB'); else pillHtml = applyFp(pillHtml, cat, s.id, a);
        const gesamtColor = ownColor ? lightenColor(ownColor, rowLighten !== undefined ? rowLighten : GRADIENT_STEP) : undefined;
        const gesamtBgAttr = gesamtColor ? ` style="background:${gesamtColor};"` : '';
        let html = `<td class="total-col"${gesamtBgAttr}><div class="cell-stack" data-open-entries data-cat="${cat.id}" data-group="${g.id}" data-student="${s.id}">${pillHtml}${overrideMark(cat, g, s)}${noteMarkHtml(cat.overrideNotes && cat.overrideNotes[s.id])}</div></td>`;
        cat.children.forEach(child => { html += catCell(child, g, s, depth+1, undefined, rowLighten); });
        return html;
      }
      if(cat.mode === 'observation' && !isContainerCat(cat)){
        const ov = cat.overrides && cat.overrides[s.id];
        const obsMark = studentMark(cat, s.id);
        const pillHtml = obsMark ? markPillHtml(obsMark) : ((ov !== undefined && ov !== null && ov !== '') ? notePill(cls, a) : observationPill(cat.entries[s.id]));
        return `<td${colorCls}${bgAttr}><div class="cell-stack" data-open-entries data-cat="${cat.id}" data-group="${g.id}" data-student="${s.id}">${pillHtml}${overrideMark(cat, g, s)}</div></td>`;
      }
      let subLabel;
      if(cat.mode === 'points' && !isContainerCat(cat)){
        const entry = cat.entries[s.id];
        if(entry) subLabel = `${entry.points ?? '?'}/${entry.maxPoints ?? '?'}`;
      }
      // NB auf einer (noch leeren) Sammelkategorie wird als Überschreibung gespeichert, Marken an Einzelspalten am Eintrag
      const cellMark = studentMark(cat, s.id) || totalNbMark(cat, s.id);
      if(cellMark){
        return `<td${colorCls}${bgAttr}><div class="cell-stack" data-open-entries data-cat="${cat.id}" data-group="${g.id}" data-student="${s.id}">${markPillHtml(cellMark)}</div></td>`;
      }
      return `<td${colorCls}${bgAttr}><div class="cell-stack" data-open-entries data-cat="${cat.id}" data-group="${g.id}" data-student="${s.id}">${applyFp(notePill(cls, a, subLabel, cat.displayScale), cat, s.id, a)}${overrideMark(cat, g, s)}${noteMarkHtml((cat.entries[s.id] && cat.entries[s.id].note) || (cat.overrideNotes && cat.overrideNotes[s.id]))}</div></td>`;
    }
    visibleStudents.forEach((s, rowIdx) => {
      const end = semesterEndnoteForStudent(cls, sem, s.id);
      const endNb = endnoteNbMark(sem, s.id);
      const overridden = !endNb && sem.endnoteOverrides && sem.endnoteOverrides[s.id] !== undefined && sem.endnoteOverrides[s.id] !== '';
      const isSelected = state.selectedStudentId === s.id;
      const hasNotes = studentHasObservationNotes(sem, s.id);
      let row = `<tr class="${isSelected?'student-selected':''}"><td class="name-col${sem.studentColColor?' has-custom-color':''}" data-select-student="${s.id}" style="cursor:pointer;text-align:left;${sem.studentColColor?`background:${sem.studentColColor};`:''}"><div class="name-cell-row" style="justify-content:flex-start;"><span style="display:flex;align-items:center;gap:4px;text-align:left;flex:1;">${escapeHtml(s.name)}${hasNotes ? `<button class="colx dark" data-show-ub-notes="${s.id}" title="Unterrichtsbeobachtungen mit Notizen ansehen" style="flex-shrink:0;">📝</button>` : ''}${permTagsHtml(cls, s.id)}${absenceBadgeHtml(cls, sem, s.id)}${flagBtnHtml(cls, s.id, isSelected)}${isSelected ? `<button class="colx dark" data-student-sheet="${s.id}" title="Beratungsblatt (PDF)" style="flex-shrink:0;">📄</button>` : ''}</span><button class="colx dark" data-del-student="${s.id}" title="Aus ${escapeHtml(sem.name)} entfernen" style="flex-shrink:0;margin-left:6px;">✕</button></div></td>`;
      let endPillHtml = endNb ? markPillHtml('NB') : notePill(cls, end);
      let endBadge = '';
      if(borderlineEnabled && !endNb){
        if(overridden){
          endBadge = `<span class="border-badge border-resolved" title="Grenzfall manuell entschieden">⚑</span>`;
        } else {
          const endStatus = computeBorderlineStatus(cls, end);
          if(endStatus && !endStatus.exact){
            endPillHtml = tieOnlyBadgeHtmlEndnote(endStatus, s.id);
          } else {
            endBadge = borderlineBadgeHtmlEndnote(endStatus, s.id);
          }
        }
      }
      row += `<td class="endnote-col"${sem.endnoteColor?` style="background:${sem.endnoteColor};"`:''}><div class="cell-stack" data-open-endnote="${s.id}">${endPillHtml}${endBadge}${(borderlineEnabled && overridden) ? `<button class="reset-arrow" data-reset-endnote="${s.id}" title="Automatische Berechnung wiederherstellen"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;"><rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" stroke-width="2.2"/><rect x="7" y="5" width="10" height="4" rx="0.8" fill="currentColor"/><circle cx="7.6" cy="13.2" r="1.15" fill="currentColor"/><circle cx="12" cy="13.2" r="1.15" fill="currentColor"/><circle cx="16.4" cy="13.2" r="1.15" fill="currentColor"/><circle cx="7.6" cy="17.4" r="1.15" fill="currentColor"/><circle cx="12" cy="17.4" r="1.15" fill="currentColor"/><circle cx="16.4" cy="17.4" r="1.15" fill="currentColor"/></svg></button>` : ''}</div></td>`;
      groups.forEach(g => {
        if(g.collapsed){
          const collapsedGt = groupGesamtForStudent(cls, g, s.id);
          row += `<td class="total-col collapsed-col" data-toggle-group-collapse="${g.id}" style="cursor:pointer;text-align:center;" title="Einblenden"><div class="cell-stack" style="display:flex;justify-content:center;width:100%;">${totalNbMark(g, s.id) ? markPillHtml('NB') : applyFp(notePill(cls, collapsedGt), g, s.id, collapsedGt)}</div></td>`;
          return;
        }
        const gt = groupGesamtForStudent(cls, g, s.id);
        const gOv = g.overrides && g.overrides[s.id];
        const gNb = totalNbMark(g, s.id);
        const gOverridden = !gNb && gOv !== undefined && gOv !== null && gOv !== '';
        let gPillHtml = gNb ? markPillHtml('NB') : notePill(cls, gt);
        let badge = '';
        if(borderlineEnabled && !gNb){
          if(gOverridden){
            badge = `<span class="border-badge border-resolved" title="Grenzfall manuell entschieden">⚑</span>`;
          } else {
            const status = computeBorderlineStatus(cls, gt);
            if(status && !status.exact){
              gPillHtml = tieOnlyBadgeHtmlGroup(status, g.id, s.id);
            } else {
              badge = borderlineBadgeHtml(status, g.id, s.id);
            }
          }
        }
        if(!gNb) gPillHtml = applyFp(gPillHtml, g, s.id, gt);
        const groupColorBody = g.bgColor || colorForGroupName(g.name);
        const rowProgress = visibleStudents.length > 1 ? rowIdx / (visibleStudents.length - 1) : 0;
        const rowLighten = GRADIENT_STEP + rowProgress * ADDITIONAL_ROW_FADE;
        const groupGesamtColorBody = lightenColor(groupColorBody, rowLighten);
        row += `<td class="total-col" style="background:${groupGesamtColorBody};"><div class="cell-stack" data-open-group="${g.id}" data-student="${s.id}">${gPillHtml}${badge}${noteMarkHtml(g.overrideNotes && g.overrideNotes[s.id])}${(borderlineEnabled && gOverridden) ? `<button class="reset-arrow" data-reset-group="${g.id}" data-student="${s.id}" title="Automatische Berechnung wiederherstellen"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;"><rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" stroke-width="2.2"/><rect x="7" y="5" width="10" height="4" rx="0.8" fill="currentColor"/><circle cx="7.6" cy="13.2" r="1.15" fill="currentColor"/><circle cx="12" cy="13.2" r="1.15" fill="currentColor"/><circle cx="16.4" cy="13.2" r="1.15" fill="currentColor"/><circle cx="7.6" cy="17.4" r="1.15" fill="currentColor"/><circle cx="12" cy="17.4" r="1.15" fill="currentColor"/><circle cx="16.4" cy="17.4" r="1.15" fill="currentColor"/></svg></button>` : ''}</div></td>`;
        if(g.children.length === 0){
          row += `<td></td>`;
        } else {
          g.children.forEach(cat => { row += catCell(cat, g, s, 0, undefined, rowLighten); if(tallyHost && cat === tallyHost) row += tallyColsOf(cls).map(c => tallyCellHtml(cat, c.key, s.id)).join(''); });
        }
      });
      body += row + `</tr>`;
    });
  }

  const addRow = `<tr class="add-student-row"><td class="name-col"><input type="text" id="newStudentName" placeholder="Nachname, Vorname"></td>
    <td colspan="${colCount-1}" style="text-align:left;"><button class="small" id="addStudentBtn">Hinzufügen</button></td></tr>`;

  main.innerHTML = `<div class="grid-wrap"><table class="grid"><thead>${groupHeadRow}${catHeaderRows}</thead><tbody>${body}${addRow}</tbody></table>${state.positionMode ? `<div class="name-resize-handle" title="Namensspalte schmaler/breiter: Pfeile antippen oder Strich ziehen"><button type="button" class="nr-step" data-name-step="-1">‹</button><span class="nr-drag" data-name-resize><span class="nr-line"></span></span><button type="button" class="nr-step" data-name-step="1">›</button></div>` : ''}</div>`;

  if(tallyHost){
    const tb = main.querySelector('table.grid');
    if(tb){
      slimTallyHead(tb, cls);
      const wrapEl = main.querySelector('.grid-wrap');
      if(wrapEl) wrapEl.insertAdjacentHTML('beforebegin', '<div class="tally-bar"><span class="chip">Strichlisten aktiv</span> Antippen = +1 (heute) · lang drücken = Einträge · im Strichlisten-Modus sind nur Namen und Strichlisten sichtbar <button class="ghost small" id="tallyManageBtn" style="margin-left:auto;">⚙ Listen bearbeiten</button></div>');
      const mb = document.getElementById('tallyManageBtn'); if(mb) mb.onclick = () => openTallyManager(cls);
      const ab = document.getElementById('tallyAddBtn');
      if(ab) ab.onclick = () => openTallyNewDialog(cls);
      applyTallyLayout();
    }
  }
  wireTallyCells(main, cls, sem);
  main.querySelectorAll('[data-select-student]').forEach(el=>{
    let pressTimer = null, longPressed = false, startX = 0, startY = 0;
    const clear = () => { clearTimeout(pressTimer); };
    el.addEventListener('pointerdown', (e) => {
      if(e.target.closest('[data-del-student], [data-show-ub-notes], [data-student-sheet], [data-student-flag], [data-absence]')) return;
      longPressed = false;
      startX = e.clientX; startY = e.clientY;
      pressTimer = setTimeout(() => {
        longPressed = true;
        renameStudent(cls, el.dataset.selectStudent);
      }, 500);
    });
    el.addEventListener('pointermove', (e) => {
      if(Math.abs(e.clientX-startX) > 8 || Math.abs(e.clientY-startY) > 8) clear();
    });
    el.addEventListener('pointerup', clear);
    el.addEventListener('pointercancel', clear);
    el.onclick = (e) => {
      if(e.target.closest('[data-del-student], [data-show-ub-notes], [data-student-sheet], [data-student-flag], [data-absence]')) return;
      if(longPressed){ longPressed = false; return; }
      const id = el.dataset.selectStudent;
      const wasSelected = state.selectedStudentId === id;
      state.selectedStudentId = wasSelected ? null : id;
      if(wasSelected && state.incognito) state.incognito = false;
      render();
    };
  });
  installLockGuard(main, sem);
  main.querySelectorAll('[data-absence]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); openAbsenceDialog(cls, sem, el.dataset.absence); };
  });
  main.querySelectorAll('[data-student-flag]').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); openStudentFlagsDialog(cls, btn.dataset.studentFlag); };
  });
  main.querySelectorAll('[data-student-sheet]').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); openStudentSheetDialog(cls, sem, btn.dataset.studentSheet); };
  });
  main.querySelectorAll('[data-toggle-incognito]').forEach(btn=>{
    btn.onclick = (e) => {
      e.stopPropagation();
      state.incognito = !state.incognito;
      render();
    };
  });
  const searchInput = document.getElementById('searchStudent');
  if(searchInput){
    if(searchWasFocused){
      searchInput.focus();
      const pos = searchInput.value.length;
      searchInput.setSelectionRange(pos, pos);
      searchWasFocused = false;
    }
    searchInput.addEventListener('input', (e) => {
      state.searchTerm = e.target.value;
      searchWasFocused = true;
      renderGrid(main, cls, sem);
    });
  }
  main.querySelectorAll('[data-show-ub-notes]').forEach(btn=>{
    btn.onclick = (e) => {
      e.stopPropagation();
      openStudentObservationsModal(cls, sem, btn.dataset.showUbNotes);
    };
  });
  main.querySelectorAll('[data-del-student]').forEach(btn=>{
